<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿伯一次買購</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--accent:#c9899f;--accent-soft:#f6e9ee;--sky:#e5b85f;--sky-soft:#fff8e6;--line:#ead9e0;--ink:#5c4a52;--ink-soft:#a08b94;--paper:#fff;--cream:#f9eff3;--fs:13px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Huninn','Yuanti TC','Microsoft JhengHei',sans-serif;background:#fbf6f8;color:var(--ink);line-height:1.6;font-size:var(--fs)}
@media(min-width:800px){body{font-size:calc(var(--fs) + 2px)}}
.app{max-width:1020px;margin:0 auto;padding:1rem}
h1{font-size:21px;font-weight:500;text-align:center;margin-bottom:1rem;color:var(--accent)}
h2{font-size:18px;font-weight:500;margin-bottom:.75rem}
h3{font-size:15px;font-weight:500;margin-bottom:.5rem}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:1.25rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(201,137,159,.07)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px}

label{display:block;font-size:.95em;color:var(--ink-soft);margin-bottom:3px}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:10px;font-size:.95em;background:#fff;color:var(--ink);outline:none;font-family:inherit}
input[type=checkbox],input[type=radio]{width:16px;height:16px;min-width:16px;padding:0;margin:0;flex:0 0 16px;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,137,159,.14)}
textarea{resize:vertical;min-height:60px;line-height:1.7}

.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.form-group{display:flex;flex-direction:column}

button{padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;font-size:.95em;transition:all .12s;white-space:nowrap;font-family:inherit}
button:hover{background:var(--cream);border-color:var(--accent)}
button:active{transform:scale(.96)}
.bp{background:var(--accent);color:#fff;border-color:var(--accent)}
.bp:hover{background:#b87a90;border-color:#b87a90}
.bd{color:#b96e7c;border-color:#e8c3cc}
.bd:hover{background:#f9edf0}
.bs{padding:3px 8px;font-size:.88em}
.bg{border:none;background:none;color:var(--accent);padding:2px 6px}
.bg:hover{background:var(--accent-soft);border-radius:8px}
.btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:.92em}
th{text-align:center;padding:6px 8px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-weight:500;color:#a8798c;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #f6ecf0;vertical-align:middle;text-align:center;white-space:nowrap}
tr:hover td{background:#fbf5f7}
td input,td select{padding:4px 6px;font-size:.95em;border-radius:6px}

.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:.85em;font-weight:500;white-space:nowrap}
.b-blue{background:var(--sky-soft);color:#b5812e}
.b-green{background:#e2f5e6;color:#4e9a63}
.b-amber{background:#fdf0dc;color:#c08a3e}
.b-red{background:#fde5ea;color:#d16277}
.b-purple{background:#ece7fa;color:#8a75c9}
.b-gray{background:#f4eef1;color:#a58a95}
.ship-status-select{min-width:88px;font-weight:600;transition:background-color .15s,color .15s,border-color .15s}
.ship-status-sent{background:#e2f5e6;color:#3f8653;border-color:#b9dfc2}
.ship-status-pending{background:#f4eef1;color:#8d707c;border-color:#ddcfd5}
.b-teal{background:#dff4ef;color:#3e9e88}
.b-coral{background:#fdeae2;color:#d07a55}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:1rem}
.stat{background:var(--cream);border-radius:14px;padding:10px 14px;border:1px solid var(--line)}
.stat:nth-child(2){background:var(--sky-soft);border-color:#f2dfaa}
.stat-l{font-size:12px;color:var(--ink-soft)}
.stat-v{font-size:22px;font-weight:500;color:var(--accent)}
.stat:nth-child(2) .stat-v{color:#b5812e}

.empty{text-align:center;color:var(--ink-soft);padding:1.5rem;font-size:13px}
.muted{color:var(--ink-soft);font-size:.9em}

.nav{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.nav-crumb{font-size:13px;color:var(--ink-soft);cursor:pointer}
.nav-crumb:hover{color:var(--accent)}
.nav-title{font-size:16px;font-weight:500}
.group-hero{margin-bottom:1rem;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--paper);box-shadow:0 2px 8px rgba(201,137,159,.07)}
.group-hero-cover{width:100%;height:230px;object-fit:cover;display:block;background:var(--sky-soft)}
.group-hero-ph{height:120px;background:var(--sky-soft)}
.group-hero-main{padding:14px 16px}
.group-hero-title{font-size:26px;font-weight:700;line-height:1.25;color:var(--ink);margin-right:8px;overflow-wrap:anywhere}
.group-hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.group-note{margin-top:10px;padding:7px 10px;background:#fdf1f6;border-left:3px solid var(--sky);border-radius:8px;color:var(--ink-soft);font-size:.9em}

.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:12px}
.group-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(201,137,159,.07);display:flex;flex-direction:column}
.group-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(201,137,159,.15);transform:translateY(-2px)}
.gc-cover{width:100%;height:130px;object-fit:cover;display:block;background:var(--cream)}
.gc-ph{background:var(--sky-soft);position:relative}
.gc-ph:after{content:'';width:42px;height:42px;border-radius:12px;border:2px solid rgba(201,137,159,.35);box-shadow:16px 12px 0 rgba(229,184,95,.28)}
.gc-body{padding:10px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.group-card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.group-card .name{font-size:1em;font-weight:500;line-height:1.35}
.group-card .meta{display:flex;gap:6px 10px;font-size:.85em;color:var(--ink-soft);flex-wrap:wrap;margin-top:auto}
@media(min-width:800px){
  .app{max-width:1120px}
  .group-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .group-card .name{overflow-wrap:anywhere}
}

.tabs{display:flex;gap:2px;margin-bottom:1rem;border-bottom:2px solid var(--accent-soft);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tab{padding:6px 14px;cursor:pointer;border:none;background:none;font-size:.95em;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-2px;border-radius:10px 10px 0 0;flex:0 0 auto}
.tab:hover{color:var(--ink);background:var(--cream)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}

.modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(92,74,82,.35);z-index:100;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:1.5rem;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(201,137,159,.18)}

.cb{display:flex;align-items:center;gap:6px;margin:6px 0}
.cb input[type=checkbox]{width:auto}
.cb label{margin:0;font-size:13px;color:var(--ink)}

.search-bar{margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search-bar select{width:auto;min-width:100px;flex:1}

.export-box{font-family:Consolas,monospace;font-size:11px;white-space:pre;background:var(--cream);padding:.75rem;border-radius:10px;overflow:auto;max-height:300px;margin-top:8px}

.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

.filter-chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{padding:3px 12px;border-radius:14px;font-size:.9em;cursor:pointer;border:1px solid var(--line);background:#fff}
.chip:hover{background:var(--cream);border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.gear-btn{width:32px;height:32px;border:none;background:none;cursor:pointer;font-size:18px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;border-radius:10px;padding:0}
.gear-btn:hover{background:var(--accent-soft);color:var(--ink)}

.search-wrap{display:flex;align-items:center;gap:2px;background:#fff;border-radius:16px;border:1px solid transparent;transition:all .25s}
.search-wrap input{width:0;opacity:0;padding:0;border:none;background:none;transition:all .25s;font-size:.95em}
.search-wrap input:focus{box-shadow:none}
.search-wrap.open{border-color:var(--accent);box-shadow:0 2px 8px rgba(201,137,159,.15);padding-left:10px}
.search-wrap.open input{width:150px;opacity:1;padding:6px 4px}

.settings-section{margin-bottom:20px}
.settings-section h3{border-bottom:1px solid var(--accent-soft);padding-bottom:6px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #fdf1f6;gap:10px;flex-wrap:wrap}
.setting-label{font-size:13px;color:var(--ink);flex:1;min-width:100px}
.setting-sub{font-size:11px;color:var(--ink-soft)}
.setting-control{min-width:120px}
.setting-control input,.setting-control select{width:100%;font-size:13px}
.setting-control input[type=checkbox]{width:auto}
.color-row{display:flex;gap:6px;align-items:center}
.color-row input[type=color]{width:36px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer}

.bp-detail{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.bp-detail-img{width:140px;max-width:30%;border-radius:12px;border:1px solid var(--line);flex-shrink:0;cursor:zoom-in}
.twisty{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:7px solid #888780;display:inline-block;transition:transform .12s;flex-shrink:0}
.twisty.open{transform:rotate(90deg)}
@media(max-width:640px){
  .app{padding:.75rem}
  .card{padding:1rem}
  .modal{width:94%;padding:1rem;border-radius:14px}
  .group-hero-title{font-size:22px}
  .bp-detail{flex-direction:column;align-items:center}
  .bp-detail-img{width:180px;max-width:70%}
  .bp-detail>div{width:100%}
  .box-product{padding:10px}
  .setting-control{width:100%;min-width:0}
}
@media(max-width:480px){
  .form-row{grid-template-columns:1fr}
}

td .slot-del{display:none;color:#d16277;cursor:pointer;margin-left:4px;font-weight:bold}
td:hover .slot-del{display:inline}
.slot-empty{cursor:pointer}
.slot-empty:hover{background:#f6dfe9!important}
.manual-grid-cell{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-x pan-y}
.manual-grid-cell.manual-moving{outline:2px solid #d6a83f;outline-offset:-2px;background:#fff3c8!important}

.progress-bar{height:8px;background:var(--cream);border-radius:4px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;border-radius:4px;transition:width .3s}

.box-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin:8px 0}
.box-cell{text-align:center;padding:6px 4px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.box-cell.full{background:#e2f5e6;border-color:#a5d9b2;color:#4e9a63}
.box-cell.empty{background:#fde5ea;border-color:#f3b8c4;color:#d16277}
.box-cell.partial{background:#fdf0dc;border-color:#f2d5a4;color:#c08a3e}

.box-product{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.box-product-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}

.box-instance{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;background:#fef7fa}
.box-instance-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

.price-grid{display:grid;grid-template-columns:1fr 100px;gap:4px 10px;align-items:center;margin:8px 0;font-size:13px}
.price-grid label{margin:0;font-size:13px}
.price-grid input{width:100px}
.price-summary{font-size:12px;padding:8px 10px;background:#fdf1f6;border-radius:6px;margin-top:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modalContent"></div>
</div>

<script>document.write('<script src="data.js'+(location.protocol==='file:'?'':'?v='+Date.now())+'"><\/script>');</script>
<script>
const $=s=>document.querySelector(s);
const RO=!!window.VIEWER_DB;

const DEFAULT_SETTINGS={
  accentColor:'#c9899f',
  fontSize:13,
  appTitle:'阿伯一次買購',
  fieldNick:'暱稱',
  fieldItem:'商品',
  fieldQty:'數量',
  fieldPrice:'單價',
  fieldSeries:'系列',
  fieldNote:'備註',
  showSeries:false,
  showNote:true,
  showPrice:true,
  defaultType:'basic',
  defaultStatus:'進行中',
  statuses:'進行中,已截團待收款,收款中,已收完定金,已完成收款,已到貨,已結團,已流團',
  typeCarryLabel:'帶多統計',
  typeCarryDesc:'社團售物，帶越多越優先',
  typeBoxLabel:'拆盒',
  typeBoxDesc:'拆盒分款，湊滿一盒的內容物才成團',
  typeBasicLabel:'一般代購',
  typeBasicDesc:'單純統計訂單數量金額',
};
function loadSettings(){
  if(RO)return{...DEFAULT_SETTINGS,...(window.VIEWER_SETTINGS||{})};
  const s=JSON.parse(localStorage.getItem('gp_settings')||'{}');
  if((s.accentColor==='#185fa5'||s.accentColor==='#e07a9e')&&!localStorage.getItem('gp_accent_mig2')){
    s.accentColor='#c9899f';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_accent_mig2','1');
  }
  if(s.appTitle==='社團周邊代購管理'&&!localStorage.getItem('gp_title_mig')){
    s.appTitle='阿伯一次買購';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_title_mig','1');
  }
  if(!localStorage.getItem('gp_status_mig2')){
    if(s.statuses){
      const drop=['開團中','已截單','已封存'];
      const list=s.statuses.split(',').map(x=>x.trim()).filter(x=>x&&!drop.includes(x));
      for(const add of['進行中','收款中','已到貨','已結團'])if(!list.includes(add))list.push(add);
      s.statuses=list.join(',');
    }
    if(s.defaultStatus==='開團中')s.defaultStatus='進行中';
    localStorage.setItem('gp_settings',JSON.stringify(s));
    localStorage.setItem('gp_status_mig2','1');
  }
  if(!localStorage.getItem('gp_status_mig3')){
    if(s.statuses){
      const list=s.statuses.split(',').map(x=>x.trim()).filter(Boolean);
      if(!list.includes('已完成收款')){
        const i=list.indexOf('收款中');
        list.splice(i>=0?i+1:list.length,0,'已完成收款');
        s.statuses=list.join(',');
        localStorage.setItem('gp_settings',JSON.stringify(s));
      }
    }
    localStorage.setItem('gp_status_mig3','1');
  }
  if(!localStorage.getItem('gp_status_mig4')){
    if(s.statuses){
      const list=s.statuses.split(',').map(x=>x.trim()).filter(Boolean);
      if(!list.includes('已截團待收款')){
        const i=list.indexOf('進行中');
        list.splice(i>=0?i+1:list.length,0,'已截團待收款');
        s.statuses=list.join(',');
        localStorage.setItem('gp_settings',JSON.stringify(s));
      }
    }
    localStorage.setItem('gp_status_mig4','1');
  }
  if(!localStorage.getItem('gp_status_mig5')){
    const list=(s.statuses||DEFAULT_SETTINGS.statuses).split(',').map(x=>x.trim()).filter(Boolean);
    if(!list.includes('已流團')){
      list.push('已流團');
      s.statuses=list.join(',');
      localStorage.setItem('gp_settings',JSON.stringify(s));
    }
    localStorage.setItem('gp_status_mig5','1');
  }
  if(!localStorage.getItem('gp_status_mig6')){
    const list=(s.statuses||DEFAULT_SETTINGS.statuses).split(',').map(x=>x.trim()).filter(Boolean);
    if(!list.includes('已收完定金')){
      const i=list.indexOf('已完成收款');
      list.splice(i>=0?i:list.length,0,'已收完定金');
      s.statuses=list.join(',');
      localStorage.setItem('gp_settings',JSON.stringify(s));
    }
    localStorage.setItem('gp_status_mig6','1');
  }
  return {...DEFAULT_SETTINGS,...s};
}
function saveSetting(key,val){
  const s=loadSettings();s[key]=val;
  localStorage.setItem('gp_settings',JSON.stringify(s));
}
function saveAllSettings(obj){
  const s=loadSettings();Object.assign(s,obj);
  localStorage.setItem('gp_settings',JSON.stringify(s));
}
function resetSettings(){
  localStorage.removeItem('gp_settings');
}
function S(){return loadSettings();}

function getTypes(){
  const s=S();
  return {
    carry:{label:s.typeCarryLabel,badge:'b-purple',desc:s.typeCarryDesc},
    box:{label:s.typeBoxLabel,badge:'b-coral',desc:s.typeBoxDesc},
    basic:{label:s.typeBasicLabel,badge:'b-blue',desc:s.typeBasicDesc},
  };
}
function getStatuses(){return S().statuses.split(',').map(s=>s.trim()).filter(Boolean);}
function getSB(){
  const colors=['b-green','b-amber','b-blue','b-purple','b-gray','b-teal','b-coral','b-red'];
  const st=getStatuses();const m={};
  st.forEach((s,i)=>{m[s]=colors[i%colors.length];});
  m['已流團']='b-gray';
  return m;
}
function applyTheme(){
  const s=S();
  document.title=s.appTitle;
  document.documentElement.style.setProperty('--accent',s.accentColor);
  document.documentElement.style.setProperty('--fs',s.fontSize+'px');
  document.querySelectorAll('.bp').forEach(el=>{el.style.background=s.accentColor;el.style.borderColor=s.accentColor;});
  document.querySelectorAll('.tab.active').forEach(el=>{el.style.color=s.accentColor;el.style.borderBottomColor=s.accentColor;});
}

function localDateValue(ts){
  const d=new Date(Number(ts)||Date.now());
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function localDateTimeValue(ts){
  const d=new Date(Number(ts)||Date.now()),pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function groupOpenedAt(g){
  const m=String(g.createdAt||'').match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  return m?new Date(Number(m[1]),Number(m[2])-1,Number(m[3])).getTime():0;
}
function inferMemberJoinedAt(db,nick){
  const times=(db.groups||[]).filter(g=>(g.orders||[]).some(o=>o.nick===nick)).map(groupOpenedAt).filter(Boolean);
  return times.length?Math.min(...times):Date.now();
}
function releaseLegacyBindLocks(db){
  let changed=false;
  for(const g of db?.groups||[]){
    for(const o of g.orders||[]){
      if(o.bind&&o.autoBind==null){o.autoBind=true;changed=true;}
      if(o.bindLift){o.lift=true;delete o.bindLift;changed=true;}
    }
    for(const p of g.boxProducts||[]){
      const frozen=p.frozenPins;if(!frozen)continue;
      const releaseRows=new Set();
      for(const[key,pin]of Object.entries(frozen)){
        if(pin&&typeof pin==='object'&&(pin.empty||pin.bind))releaseRows.add(parseInt(key.split('|||')[0]));
      }
      if(!releaseRows.size)continue;
      for(const key of Object.keys(frozen))if(releaseRows.has(parseInt(key.split('|||')[0])))delete frozen[key];
      changed=true;
    }
  }
  return changed;
}
const LOCAL_BUYERS_KEY='gp_local_group_buyers_v1';
function loadLocalBuyerStore(){
  try{
    const data=JSON.parse(localStorage.getItem(LOCAL_BUYERS_KEY)||'{}');
    return data&&typeof data==='object'&&!Array.isArray(data)?data:{};
  }catch(err){console.error(err);return{};}
}
function saveLocalBuyerStore(store){localStorage.setItem(LOCAL_BUYERS_KEY,JSON.stringify(store));}
function normalizeBuyerInfo(info){
  const b=info&&typeof info==='object'?info:{};
  let contact=String(b.contact||''),url=String(b.url||'');

function migrateLegacyBuyerData(db,rawDb){
  if(!Object.prototype.hasOwnProperty.call(db,'buyers'))return false;
  const legacy=db.buyers&&typeof db.buyers==='object'?db.buyers:{};
  delete db.buyers;
  if(!Object.keys(legacy).length)return true;
  const store=loadLocalBuyerStore(),assigned=new Set();
  let touched=false;
  for(const g of db.groups||[]){
    const nicks=new Set([...(g.orders||[]).map(o=>o.nick),...Object.keys(g.pay||{})]);
    const bucket=store[String(g.id)]||(store[String(g.id)]={});
    for(const nick of nicks){
      if(!legacy[nick])continue;
      assigned.add(nick);
      const next=mergeBuyerInfo(bucket[nick],legacy[nick]);
      if(JSON.stringify(bucket[nick]||null)!==JSON.stringify(next)){bucket[nick]=next;touched=true;}
    }
  }
  const unassigned=store._unassigned||(store._unassigned={});
  for(const[nick,info]of Object.entries(legacy)){
    if(assigned.has(nick))continue;
    const next=mergeBuyerInfo(unassigned[nick],info);
    if(JSON.stringify(unassigned[nick]||null)!==JSON.stringify(next)){unassigned[nick]=next;touched=true;}
  }
  if(!touched)return true;
  try{
    localStorage.setItem('gp_db2',JSON.stringify(db));
    saveLocalBuyerStore(store);
    return true;
  }catch(err){
    db.buyers=legacy;
    try{localStorage.setItem('gp_db2',rawDb);}catch(restoreErr){console.error(restoreErr);}
    console.error(err);
    return false;
  }
}

function loadDB(){
  if(RO){if(!_vdb){_vdb=window.VIEWER_DB;releaseLegacyBindLocks(_vdb);}return _vdb;}
  const rawDb=localStorage.getItem('gp_db2')||'{"groups":[],"nid":1}';

  let changed=releaseLegacyBindLocks(db);
  if(migrateLegacyBuyerData(db,rawDb))changed=true;
  if(migrateLegacyPayNotes(db))changed=true;
  const statusMap={'開團中':'進行中','已截單':'收款中','已封存':'已結團'};
  for(const g of db.groups){
    if(statusMap[g.status]){g.status=statusMap[g.status];changed=true;}
    if(g.status==='進行中'&&!g.orderRulesVersion){g.orderRulesVersion=2;changed=true;}
    if(g.deadline&&g.status==='進行中'&&new Date(g.deadline)<new Date()){g.status='已截團待收款';changed=true;}
    // 既有的已到貨團補上到貨時間（囤貨期限起算點，可在團內設定校正）
    if(['已到貨','已結團'].includes(g.status)&&!g.arrivedAt){g.arrivedAt=Date.now();changed=true;}
  }

  if(!db.fixedTeam)db.fixedTeam={};
  if(!db.teamAdmins)db.teamAdmins={};
  if(!db.teamNotes)db.teamNotes={};
  if(!db.teamJoinedAt)db.teamJoinedAt={};
  if(!db.units)db.units=[]; // 團體庫：{id,name,icon}
  if(!db.roles)db.roles=[]; // 固位角色清單
  if(!db.roleUnits)db.roleUnits={}; // 角色所屬團體：{角色名稱:團體id}
  for(const g of db.groups){
    if(g.fixedTeam){
      for(const[nick,slots]of Object.entries(g.fixedTeam)){
        if(!db.fixedTeam[nick])db.fixedTeam[nick]=slots;
      }
      delete g.fixedTeam;changed=true;
    }
  }
  for(const nick of Object.keys(db.fixedTeam||{})){
    if(!Number.isFinite(Number(db.teamJoinedAt[nick]))){
      db.teamJoinedAt[nick]=inferMemberJoinedAt(db,nick);changed=true;
    }
  }
  const knownRoles=new Set(db.roles);
  for(const slots of Object.values(db.fixedTeam||{})){
    for(const role of Object.keys(slots||{})){
      if(!knownRoles.has(role)){db.roles.push(role);knownRoles.add(role);changed=true;}
    }
  }  for(const g of db.groups){
    if(g.type==='box'&&(g.boxProducts||[]).length){
      for(const o of g.orders){
        if(o.bpId==null){
          const bp=g.boxProducts.find(p=>p.contents.includes(o.item));
          if(bp){o.bpId=bp.id;changed=true;}
        }
      }
    }
  }
  if(changed)localStorage.setItem('gp_db2',JSON.stringify(db));
  return db;
}

function isShipQueryGroup(g){return ['已收完定金','已完成收款','已到貨','已結團'].includes(g.status);}
function showShipModal(){
  const db=loadDB();

      const allShipped=memberGroupAllShipped(list,ship,_spNick);
      for(const o of list){

          ?`<span class="badge ${st.s?'b-green':'b-gray'}">${st.s?'已出貨':'未出貨'}</span>`

function utf8ToBase64(str){
  const bytes=new TextEncoder().encode(str);
  let bin='';
  const size=0x8000;
  for(let i=0;i<bytes.length;i+=size)bin+=String.fromCharCode(...bytes.subarray(i,i+size));
  return btoa(bin);
}
async function sha256Text(str){
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function githubPagesFileUrl(c,filePath){
  const path=filePath.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  return 'https://'+c.owner+'.github.io/'+encodeURIComponent(c.repo)+'/'+path;
}
function findDataImages(root){
  const found=new Map();
  const visit=value=>{
    if(!value||typeof value!=='object')return;
    for(const key of Object.keys(value)){
      const item=value[key];
      if(typeof item==='string'&&/^data:image\/(?:png|jpeg|webp|gif);base64,/i.test(item)){
        if(!found.has(item))found.set(item,[]);
        found.get(item).push({parent:value,key});
      }else if(item&&typeof item==='object')visit(item);
    }
  };
  visit(root);
  return found;
}
async function uploadDataImage(c,dataUrl){
  const match=dataUrl.match(/^data:(image\/(?:png|jpeg|webp|gif));base64,(.+)$/i);
  if(!match)throw new Error('圖片格式無法上傳');
  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif'}[match[1].toLowerCase()]||'jpg';
  const hash=await sha256Text(dataUrl);
  const filePath='images/'+hash.slice(0,24)+'.'+ext;

async function migrateDataImagesToGithub(c){
  const db=loadDB();
  const images=findDataImages(db);
  if(!images.size)return 0;
  let done=0;
  for(const [dataUrl,refs] of images){
    setGhStatus('正在上傳圖片 '+(done+1)+' / '+images.size+'...');
    const url=await uploadDataImage(c,dataUrl);
    for(const ref of refs)ref.parent[ref.key]=url;
    saveDB(db);
    done++;
  }
  return done;
}
async function ghFetch(c,filePath,opts={}){
  const cleanPath=filePath.replace(/^\/+/, '');
  const url='https://api.github.com/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)+'/contents/'+cleanPath+(opts.query||'');
  const res=await fetch(url,{
    method:opts.method||'GET',
    headers:{
      'Authorization':'Bearer '+c.token,
      'Accept':opts.accept||'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',
      ...(opts.headers||{})
    },
    body:opts.body
  });
  if(!res.ok&&!(opts.allow404&&res.status===404)){
    const text=await res.text();
    throw new Error('GitHub 回應 '+res.status+'：'+text.slice(0,240));
  }
  return res;
}

// 固位 pass 統計：特殊團（★）截團後，固位成員沒喊自己固位角色的商品即算一次 pass（連續累計）
// 只要在較新的特殊團裡有喊該角色，之前累積的 pass 次數就歸零重新算起
// 條件：該團有販售該角色（在某商品的款式中）；有喊單（綁單不算）即中斷連續紀錄
function passStats(){
  const db=loadDB(),team=db.fixedTeam||{},joinedMap=db.teamJoinedAt||{};
  // 依開團時間新→舊排序，逐團往回推算「連續 pass 次數」
  const byNew=(a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||b.id-a.id;
  const starGroups=db.groups.filter(g=>g.type==='box'&&g.starGroup).sort(byNew);
  const res={};
  for(const[nick,slots]of Object.entries(team)){
    for(const[style,pos]of Object.entries(slots||{})){
      if(pos.t!=='slot')continue; // 只監控固位角色
      let count=0;
      const joinedAt=Number(joinedMap[nick])||0;
      for(const g of starGroups){
        const openedAt=groupOpenedAt(g);
        if(joinedAt&&openedAt&&openedAt<joinedAt)continue;
        const styles=new Set((g.boxProducts||[]).flatMap(p=>p.contents));
        if(!styles.has(style))continue; // 該團沒賣這個角色不算
        const hasOrder=g.orders.some(o=>!o.bind&&o.nick===nick&&o.item===style);
        if(hasOrder)break; // 進行中的星號團只要已喊，就立即把先前 pass 歸零
        if(g.status!=='進行中')count++; // 尚未截團且沒喊，暫時不增加 pass
      }
      if(count>0){res[nick]=res[nick]||{};res[nick][style]=count;}
    }
  }
  return res;
}

function collectFixedTeamForm(){
  const team={},admins={},notes={},joinedAt={};
  document.querySelectorAll('#ftList .ft-row,#ftList .ft-member').forEach(el=>{
    const nick=el.dataset.nick;
    if(el.classList.contains('ft-row')){
      team[nick]=_ftTeam[nick]||{};
      if(_ftAdmins[nick])admins[nick]=true;
      if(_ftNotes[nick])notes[nick]=_ftNotes[nick];
      joinedAt[nick]=Number(_ftJoinedAt[nick])||Date.now();
      return;
    }
    const slots={};
    el.querySelectorAll('.ftSlot').forEach(chip=>{
      const style=chip.dataset.style,value=chip.querySelector('.ftSel')?.value;
      if(!style||!value)return;
      if(value==='pick')slots[style]={t:'pick'};
      else if(value.startsWith('slot:'))slots[style]={t:'slot',r:parseInt(value.slice(5))||1};
    });
    team[nick]=slots;
    if(el.querySelector('.ftAdmin')?.checked)admins[nick]=true;
    const note=el.querySelector('.ftNote')?.value.trim();
    if(note)notes[nick]=note;
    const dateValue=el.querySelector('.ftJoinedAt')?.value;
    const previous=Number(_ftJoinedAt[nick])||0;
    joinedAt[nick]=dateValue===localDateValue(previous)?previous:(dateValue?new Date(dateValue+'T00:00:00').getTime():Date.now());
  });
  return {team,admins,notes,joinedAt};
}
function nicknameInUse(db,nick){
  if(Object.prototype.hasOwnProperty.call(db.fixedTeam||{},nick))return true;
  if(localBuyerNicknameInUse(nick))return true;
  if(localPayNoteNicknameInUse(nick))return true;
  return (db.groups||[]).some(g=>(g.orders||[]).some(o=>o.nick===nick)||Object.prototype.hasOwnProperty.call(g.pay||{},nick));
}
function renamePinNick(map,oldNick,newNick){
  for(const key of Object.keys(map||{})){
    const pin=map[key];
    if(typeof pin==='string'&&pin===oldNick)map[key]=newNick;
    else if(pin&&typeof pin==='object'&&pin.nick===oldNick)pin.nick=newNick;
  }
}
function renameStoredNickFields(value,oldNick,newNick,seen=new WeakSet()){
  if(!value||typeof value!=='object'||seen.has(value))return;
  seen.add(value);
  if(Object.prototype.hasOwnProperty.call(value,'nick')&&value.nick===oldNick)value.nick=newNick;
  for(const child of Object.values(value))renameStoredNickFields(child,oldNick,newNick,seen);
}
function renameMemberEverywhere(db,oldNick,newNick){
  db.fixedTeam[newNick]=db.fixedTeam[oldNick]||{};
  delete db.fixedTeam[oldNick];
  if(Object.prototype.hasOwnProperty.call(db.teamAdmins||{},oldNick)){
    db.teamAdmins[newNick]=db.teamAdmins[oldNick];
    delete db.teamAdmins[oldNick];
  }
  if(Object.prototype.hasOwnProperty.call(db.teamNotes||{},oldNick)){
    db.teamNotes[newNick]=db.teamNotes[oldNick];
    delete db.teamNotes[oldNick];
  }
  if(Object.prototype.hasOwnProperty.call(db.teamJoinedAt||{},oldNick)){
    db.teamJoinedAt[newNick]=db.teamJoinedAt[oldNick];
    delete db.teamJoinedAt[oldNick];
  }

  for(const g of db.groups||[]){
    // 同步所有已保存的喊單、拆配快照、手動表格與後續新增的具名登記資料。
    renameStoredNickFields(g,oldNick,newNick);
    for(const order of g.orders||[])if(order.nick===oldNick)order.nick=newNick;
    if(Object.prototype.hasOwnProperty.call(g.pay||{},oldNick)){
      g.pay[newNick]=g.pay[oldNick];
      delete g.pay[oldNick];
    }
    if(g.hiddenStatsNicks)g.hiddenStatsNicks=[...new Set(g.hiddenStatsNicks.map(n=>n===oldNick?newNick:n))];
    if(g.ship){
      const moved={};
      for(const[key,value]of Object.entries(g.ship)){
        const parts=key.split('|||');
        if(parts.length>=4&&parts[parts.length-1]===oldNick)parts[parts.length-1]=newNick;
        moved[parts.join('|||')]=value;
      }
      g.ship=moved;
    }
    for(const product of g.boxProducts||[]){
      renamePinNick(product.pins,oldNick,newNick);
      renamePinNick(product.frozenPins,oldNick,newNick);
      renamePinNick(product.layoutPins,oldNick,newNick);
      for(const row of(product.manualRows||[]))for(const cell of(row||[]))if(cell&&cell.nick===oldNick)cell.nick=newNick;
      for(const pins of Object.values(product.blindAllocPins||{})){
        for(const pin of pins||[])if(pin&&pin.nick===oldNick)pin.nick=newNick;
      }
    }
  }
  renameLocalBuyerEverywhere(oldNick,newNick);
  renameLocalPayNotesEverywhere(oldNick,newNick);
}
function renameFixedMember(oldNickEnc){
  const oldNick=decodeURIComponent(oldNickEnc);
  const next=prompt(`將「${oldNick}」改成：`,oldNick);
  if(next==null)return;
  const newNick=next.trim();
  if(!newNick){alert('新名字不可空白');return;}
  if(newNick===oldNick)return;
  const current=collectFixedTeamForm();
  _ftTeam=current.team;_ftAdmins=current.admins;_ftNotes=current.notes;_ftJoinedAt=current.joinedAt;
  const db=loadDB();
  if(Object.prototype.hasOwnProperty.call(_ftTeam,newNick)||nicknameInUse(db,newNick)){
    alert(`「${newNick}」已經有人使用，不能直接合併。`);return;
  }
  if(!confirm(`確定將「${oldNick}」改成「${newNick}」？\n\n所有團的既有喊單、付款、貨況與配單位置會一起更新。`))return;
  renameMemberEverywhere(db,oldNick,newNick);
  _ftTeam[newNick]=_ftTeam[oldNick]||{};delete _ftTeam[oldNick];
  if(_ftAdmins[oldNick])_ftAdmins[newNick]=true;delete _ftAdmins[oldNick];
  if(Object.prototype.hasOwnProperty.call(_ftNotes,oldNick)){
    _ftNotes[newNick]=_ftNotes[oldNick];delete _ftNotes[oldNick];
  }
  _ftJoinedAt[newNick]=_ftJoinedAt[oldNick]||Date.now();delete _ftJoinedAt[oldNick];
  saveDB(db);
  render();showFixedTeamModal(true);
}

        <div style="overflow-x:auto"><table><thead><tr><th>款式</th><th>單價</th><th>已喊</th><th>喊單者</th><th>缺貨</th></tr></thead><tbody>`;
      for(const c of shownContents){

}

function bpPriceMode(p){return p.priceMode||(p.adjustPrice?'adjust':'average');}
function bpHasItemPrices(p){return bpPriceMode(p)!=='average'&&p.itemPrices;}
function bpFinalItemPrice(p,item){return bpHasItemPrices(p)&&p.itemPrices[item]!=null?p.itemPrices[item]:(p.avgPrice||null);}
function productItemStateKey(productId,item){return `${productId}|||${item}`;}
function productItemShortageMap(g,product,item){
  if(!product)return{};
  return (g.outOfStockAllocations||{})[productItemStateKey(product.id,item)]||{};
}
function productItemShortageQty(g,product,item){
  if(!product)return 0;
  const key=productItemStateKey(product.id,item);
  if((g.outOfStockItems||[]).includes(key))return Infinity;
  return Object.values(productItemShortageMap(g,product,item)).reduce((sum,qty)=>sum+Math.max(0,Number(qty)||0),0);
}
function productItemShortageLabel(g,product,item){
  const qty=productItemShortageQty(g,product,item);
  return qty===Infinity?'缺貨':qty>0?`缺貨 ${qty}`:'';
}
function applyOutOfStockAdjustments(g,orders){
  const legacy=new Set(g.outOfStockItems||[]),remaining={};
  for(const[key,byNick]of Object.entries(g.outOfStockAllocations||{}))remaining[key]={...byNick};
  const adjusted=[];
  for(const order of orders||[]){
    const product=(g.boxProducts||[]).find(p=>orderMatches(p,order)&&p.contents.includes(order.item));
    if(!product){adjusted.push(order);continue;}
    const key=productItemStateKey(product.id,order.item);
    if(legacy.has(key))continue;
    const qty=Math.max(0,Number(order.qty)||0),missing=Math.max(0,Number(remaining[key]?.[order.nick])||0),deduct=Math.min(qty,missing);
    if(remaining[key])remaining[key][order.nick]=missing-deduct;
    if(qty>deduct)adjusted.push(deduct?{...order,qty:qty-deduct}:order);
  }
  return adjusted;
}
function showProductItemShortageModal(gid,pid,itemEnc){
  if(RO)return;
  const g=getG(gid),product=(g?.boxProducts||[]).find(p=>p.id===pid),item=decodeURIComponent(itemEnc);if(!g||!product)return;
  const key=productItemStateKey(pid,item),legacy=(g.outOfStockItems||[]).includes(key),saved=productItemShortageMap(g,product,item),byNick={};
  for(const order of getConfirmedOrdersBeforeShortage(g)){
    if(orderMatches(product,order)&&order.item===item)byNick[order.nick]=(byNick[order.nick]||0)+Math.max(0,Number(order.qty)||0);
  }
  const rows=Object.entries(byNick).sort((a,b)=>a[0].localeCompare(b[0],'zh-Hant'));
  openModal(`<h3>${esc(product.name)}－${esc(item)} 缺貨設定</h3>
    ${rows.length?`<div style="overflow-x:auto"><table><thead><tr><th>暱稱</th><th>已成團數量</th><th>缺貨退款數量</th></tr></thead><tbody>

    </tbody></table></div>`:'<div class="empty">目前沒有已成團數量</div>'}
    <div class="btn-row" style="margin-top:14px">${rows.length?`<button type="button" onclick="selectAllProductItemShortage()">全選</button><button class="bp" onclick="saveProductItemShortage(${gid},${pid},'${encodeURIComponent(item)}')">儲存</button><button onclick="clearProductItemShortage(${gid},${pid},'${encodeURIComponent(item)}')">清除缺貨</button>`:''}<button onclick="closeModal()">取消</button></div>`);

function saveProductItemShortage(gid,pid,itemEnc){
  if(RO)return;

  document.querySelectorAll('.outOfStockQty').forEach(input=>{
    const qty=Math.max(0,parseInt(input.value)||0),max=Math.max(0,parseInt(input.max)||0);

function isLiftDisplayBuyer(g,box,buyer){

function saveBoxRowPrices(gid,pid,boxIdx){

function getLiftCandidateOrders(g,p,nick,excludeId=0){
  const source={...g,orders:g.orders.filter(o=>o.id!==excludeId&&!(o.bind&&o.autoBind&&orderMatches(p,o)))};
  const orders=source.orders.filter(o=>!o.bind&&o.nick===nick&&p.contents.includes(o.item)&&orderMatches(p,o));
  if(!orders.length)return [];
  const info=calcBoxes(source,p),allocated={};
  for(const box of info.boxes){
    const confirmed=box.status==='成團';
    for(const slot of box){
      if(!slot.buyer||slot.buyer.bind||slot.buyer.nick!==nick)continue;
      const key=(slot.buyer.oid||0)+'|||'+slot.item;
      const count=allocated[key]||(allocated[key]={total:0,pending:0});
      count.total++;
      if(!confirmed)count.pending++;
    }
  }
  return orders.filter(o=>{
    if(o.all)return true;
    const count=allocated[(o.id||0)+'|||'+o.item]||{total:0,pending:0};
    return count.pending>0||count.total<Math.max(0,parseInt(o.qty)||0);
  });
}
function hasUnconfirmedOrders(g,p,nick){return getLiftCandidateOrders(g,p,nick).length>0;}

  const selectedIds=new Set((selected||[]).map(Number));

  upG(gid,g=>{
    const product=(g.boxProducts||[]).find(b=>b.id===pid);if(!product)return;
    if(g.manualTableMode){
      for(const item of product.contents){
        const ref=manualCellRef(product,boxIdx,item);
        if(ref?.cell?.bind){detachManualCellOrder(g,product,ref.cell);ref.row[ref.index]=null;}
      }
      const team=getTeam();
      for(const x of picks){
        const ref=manualCellRef(product,boxIdx,x.item);if(!ref||ref.cell)continue;
        ref.row[ref.index]={nick:x.nick,member:Object.prototype.hasOwnProperty.call(team,x.nick),bind:true,all:false,liftExtra:false};
      }
      return;
    }
    freezeConfirmedBoxes(g,product);
    clearAutoBindOrders(g,product,null,null,boxIdx);
    for(const x of picks){
      if(product.frozenPins)delete product.frozenPins[boxIdx+'|||'+x.item];
      const price=lookupPrice(g,x.item,pid)||0;
      g.orders.push({id:g.nOid++,nick:x.nick,item:x.item,series:'',qty:1,price,note:'綁',bpId:pid,bind:true,autoBind:true,bindBox:boxIdx,ts:Date.now()});
    }

}
function freezeConfirmedBoxes(g,p){
  if(g.manualTableMode||usesLegacyClosedRules(g)||!p||p.kind==='single')return;
  const info=calcBoxes(g,p);
  const frozen=p.frozenPins||{};
  info.boxes.forEach((box,boxIdx)=>{
    if(box.status!=='成團')return;
    for(const slot of box){
      const key=boxIdx+'|||'+slot.item;
      frozen[key]=slot.buyer
        ?{nick:slot.buyer.nick,bind:!!slot.buyer.bind,oid:slot.buyer.oid||0}
        :{empty:true};
    }
  });
  p.frozenPins=frozen;
}

function boxHasMisalignedAllLiftTarget(g,p,box){
  const orderById=new Map((g.orders||[]).map(order=>[order.id,order]));
  for(const slot of box||[]){
    const buyer=slot.buyer;
    if(!buyer||!buyer.oid||!(buyer.isLift||buyer.lifted||buyer.liftExtra))continue;
    const liftOrder=orderById.get(buyer.oid);
    if(!liftOrder?.lift||!Array.isArray(liftOrder.liftTargets))continue;
    for(const rawId of liftOrder.liftTargets){
      const target=orderById.get(parseInt(rawId));
      if(!target?.all||target.nick!==liftOrder.nick||!orderMatches(p,target))continue;
      const targetSlot=box.find(candidate=>candidate.item===target.item);
      if(!targetSlot?.buyer||targetSlot.buyer.oid!==target.id)return true;
    }
  }
  return false;
}

function stabilizeConfirmedBoxes(g){
  if(usesLegacyClosedRules(g))return false;
  let repaired=false;
  for(const p of(g.boxProducts||[])){
    if(p.kind==='single')continue;
    const frozen=p.frozenPins||{};
    let info=calcBoxes(g,p),changed=false;
    const rows=[...new Set(Object.keys(frozen).map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite))];
    for(const row of rows){
      const box=info.boxes[row];
      let valid=!!box&&box.status==='成團';
      if(valid&&boxHasMisalignedAllLiftTarget(g,p,box))valid=false;
      if(valid){
        for(const[key,pin]of Object.entries(frozen)){
          if(parseInt(key.split('|||')[0])!==row)continue;
          const item=key.slice(key.indexOf('|||')+3);
          const slot=box.find(s=>s.item===item),buyer=slot&&slot.buyer;
          if(pin.empty?!!buyer:(!buyer||(pin.oid?buyer.oid!==pin.oid:buyer.nick!==pin.nick))){valid=false;break;}
        }
      }
      if(!valid){
        for(const key of Object.keys(frozen))if(parseInt(key.split('|||')[0])===row)delete frozen[key];
        changed=true;repaired=true;
      }
    }
    if(changed)info=calcBoxes(g,p);
    freezeConfirmedBoxes(g,p);
    if(p.kind==='blind'&&p.blindOpened)stabilizeBlindAllocation(g,p);
  }
  return repaired;
}

function boxOrderPriority(g,item,e,team,admins){

function boxOrderTime(o){

    if(a._isTeam||b._isTeam)return boxOrderTime(a)-boxOrderTime(b)||(a.oid||Number.MAX_SAFE_INTEGER)-(b.oid||Number.MAX_SAFE_INTEGER)||a.seq-b.seq;

function getBoxBindPlan(p,box){

    priority:Number(order[s.item])||0,contentIndex:p.contents.indexOf(s.item)

  const plan=[];
  for(const slot of box.filter(s=>!s.buyer)){

        (winnerLift===buyerLift&&compareAllBoundary(allWinner,b)<=0)
      );
      b._activeQty=allIsEarlier?Math.min(Math.max(0,parseInt(b.qty)||0),frozenRegular[b.oid]||0):Math.max(0,parseInt(b.qty)||0);
      demands[c]+=b._activeQty;
      if(b._activeQty)effectiveNonAllOrderCount++;
    }
    sortedMap[c]=sorted;
    allWinnerMap[c]=allWinner;
  }
  const maxDemand=Math.max(0,...Object.values(demands));
  const minDemand=p.contents.length?Math.min(...p.contents.map(c=>demands[c]||0)):0;
  const onlyAll=matchedOrderCount>0&&effectiveNonAllOrderCount===0;
  const blindAllCount=p.kind==='blind'&&p.blindOpened?Math.max(0,...p.contents.map(c=>Math.max(0,parseInt((p.blindCounts||{})[c])||0))):0;
  const allOnlyFallback=p.kind==='blind'&&p.blindOpened?blindAllCount:5;
  let boxesNeeded=onlyAll?(Math.max(0,parseInt(p.maxBoxes)||0)||allOnlyFallback):maxDemand;
  if(p.maxBoxes && boxesNeeded>p.maxBoxes) boxesNeeded=p.maxBoxes;
  if(!p.maxBoxes){
    let extraRows=0;
    for(const item of p.contents){
      const targetedByNick={};
      for(const b of sortedMap[item]||[]){
        if(!b.all||!b.isLiftTarget)continue;
        targetedByNick[b.nick]=Math.max(targetedByNick[b.nick]||0,liftQty[b.nick]||0);
      }
      const promoted=Object.values(targetedByNick).reduce((sum,count)=>sum+count,0);
      const available=Math.max(0,boxesNeeded-(demands[item]||0));
      extraRows=Math.max(extraRows,Math.max(0,promoted-available));
    }
    boxesNeeded+=extraRows;
  }
  for(const [nick,itemQty] of Object.entries(liftItemQty)){
    const allTargets=liftAllTargetItems[nick];
    if(!allTargets||!allTargets.size)continue;
    const baseCounts={};
    for(const item of p.contents){
      baseCounts[item]=Math.max(0,(demands[item]||0)-(itemQty[item]||0));
      if(allWinnerMap[item]||allTargets.has(item))baseCounts[item]=Math.max(baseCounts[item],boxesNeeded);
    }
    const before=Math.min(...p.contents.map(item=>baseCounts[item]||0));
    const after=Math.min(...p.contents.map(item=>(baseCounts[item]||0)+(itemQty[item]||0)));
    const frozenRows=new Set();
    for(const [key,pin] of Object.entries(p.frozenPins||{})){
      const order=pin?.oid?orderById.get(pin.oid):null;
      if(order&&order.nick===nick&&(order.lift||liftTargetIds[nick]?.has(order.id)))frozenRows.add(parseInt(key.split('|||')[0]));
    }
    const calculated=Math.max(0,after-before);
    liftQty[nick]=Math.min(liftQty[nick]||0,Math.max(calculated,frozenRows.size));
  }
  const bind=p.bindItems||{};
  let surplus=0;
  for(const c of p.contents) surplus+=Math.max(0,boxesNeeded-(demands[c]||0));

  const boxes=[];
  const remaining={};const liftUnitUsed={};
  for(const c of p.contents){
    const sorted=sortedMap[c]||[];
    const allWinner=allWinnerMap[c]||null;
    remaining[c]=[];
    const allFill=Math.max(0,boxesNeeded-(demands[c]||0));
    const frozenAll={};
    for(const[key,pin]of Object.entries(p.frozenPins||{})){
      if(!key.endsWith('|||'+c)||!pin||!pin.oid)continue;
      if(sorted.some(b=>b.all&&b.oid===pin.oid))frozenAll[pin.oid]=(frozenAll[pin.oid]||0)+1;
    }
    const frozenAllTotal=Object.values(frozenAll).reduce((sum,n)=>sum+n,0);
    let extraRemaining=Math.max(0,allFill-frozenAllTotal);
    const allExtra={};
    const liftedAll=sorted.filter(b=>b.all&&(b.isLift||b.isLiftTarget));
    const allLiftQuota=b=>b.isLiftTarget?Math.max(0,...Object.values(liftItemQty[b.nick]||{})):Math.max(0,liftQty[b.nick]||0);
    const liftUsed={};
    for(const b of liftedAll)liftUsed[b.nick]=(liftUsed[b.nick]||0)+(frozenAll[b.oid]||0);
    for(const b of liftedAll){
      if(b===allWinner)continue;
      const allowance=Math.max(0,allLiftQuota(b)-(liftUsed[b.nick]||0));
      const take=Math.min(extraRemaining,allowance);
      if(take){allExtra[b.oid]=(allExtra[b.oid]||0)+take;liftUsed[b.nick]=(liftUsed[b.nick]||0)+take;extraRemaining-=take;}
      if(!extraRemaining)break;
    }
    const fallbackAll=allWinner||sorted.filter(b=>b.all).sort(compareAllBoundary)[0]||null;
    if(fallbackAll&&extraRemaining)allExtra[fallbackAll.oid]=(allExtra[fallbackAll.oid]||0)+extraRemaining;
    for(const b of sorted){
      const qty=b.all?((frozenAll[b.oid]||0)+(allExtra[b.oid]||0)):b._activeQty;
      if(b.all){b.qty=qty;if(qty)demands[c]+=qty;}
      for(let i=0;i<qty;i++){
        let isLift=false,liftOverflow=false;
        if(b.all)isLift=(b.isLift||b.isLiftTarget)&&i<allLiftQuota(b);
        else if(b.isLift){
          const key=b.nick+'|||'+c,used=liftUnitUsed[key]||0;
          isLift=used<(liftQty[b.nick]||0);
          liftOverflow=!isLift;
          liftUnitUsed[key]=used+1;
        }
        remaining[c].push({nick:b.nick,all:b.all,bind:b.bind,fixed:b.fixed,isLift,liftOverflow,allRemainder:b.all&&b.isLiftTarget&&!isLift,memberPriority:!!b.memberPriority,isAdmin:!!b._isAdmin,priorityCls:b._cls,priorityRank:b._rank||0,oid:b.oid});
      }
    }
  }
  const minNoLift=p.contents.length?Math.min(...p.contents.map(c=>(demands[c]||0)-(liftAdd[c]||0))):0;
  const lockN=Math.min(Math.max(0,minNoLift),boxesNeeded);
  const liftersOrder=[];const _seenL={};
  for(const o of [...g.orders].sort((a,b)=>boxOrderTime(a)-boxOrderTime(b)||(a.id||0)-(b.id||0))){
    if(o.lift&&!o.bind&&p.contents.includes(o.item)&&orderMatches(p,o)&&!_seenL[o.nick]){_seenL[o.nick]=1;liftersOrder.push(o.nick);}
  }
  if(liftersOrder.length){
    const styleData={};
    for(const c of p.contents){
      const q=remaining[c];
      const liftUnits=q.filter(u=>u.isLift);
      const overflowUnits=q.filter(u=>u.liftOverflow);
      const allRemainderUnits=q.filter(u=>u.allRemainder);
      const nonLift=q.filter(u=>!u.isLift&&!u.liftOverflow&&!u.allRemainder);
      const locked=nonLift.slice(0,lockN);
      const rest=nonLift.slice(lockN);
      const byNick={};const promoUsed={};const normal=[];
      for(const u of liftUnits){(byNick[u.nick]=byNick[u.nick]||[]).push(u);if(u.all)promoUsed[u.nick]=(promoUsed[u.nick]||0)+1;}
      for(const u of rest){
        const targetAllowed=!liftTargetMode[u.nick]||!!liftTargetIds[u.nick]?.has(u.oid);
        if(!u.bind&&targetAllowed&&liftQty[u.nick]>0&&(promoUsed[u.nick]||0)<liftQty[u.nick]){
          promoUsed[u.nick]=(promoUsed[u.nick]||0)+1;u.lifted=true;
          (byNick[u.nick]=byNick[u.nick]||[]).push(u);continue;
        }
        normal.push(u);
      }
      normal.push(...overflowUnits,...allRemainderUnits);
      styleData[c]={locked,byNick,normal};
    }
    const blocks={};const blockSizes={};let offsetTotal=0;
    for(const nick of liftersOrder){
      const size=Math.max(0,...p.contents.map(c=>(styleData[c].byNick[nick]||[]).length));
      blocks[nick]=offsetTotal;blockSizes[nick]=size;offsetTotal+=size;
    }
    for(const c of p.contents){
      const{locked,byNick,normal}=styleData[c];
      const arr=new Array(offsetTotal).fill(null);
      for(const nick of liftersOrder){
        (byNick[nick]||[]).forEach((u,i)=>{arr[blocks[nick]+i]=u;});
      }
      const out=[];let ni=0;
      for(let i=0;i<arr.length;i++)out.push(arr[i]!==null?arr[i]:(ni<normal.length?normal[ni++]:null));
      while(ni<normal.length)out.push(normal[ni++]);
      remaining[c]=locked.concat(out);
    }
    for(const nick of liftersOrder){
      const take=Math.max(0,liftTake[nick]||0);
      if(!take)continue;
      const oid=liftTakeOid[nick]||0;
      for(let rowOffset=0;rowOffset<(blockSizes[nick]||0);rowOffset++){
        let left=take;
        const row=lockN+blocks[nick]+rowOffset;
        for(const c of p.contents){
          if(!left)break;
          if(remaining[c][row])continue;
          remaining[c][row]={nick,all:false,bind:false,fixed:null,isLift:true,lifted:true,liftExtra:true,oid};
          demands[c]=(demands[c]||0)+1;
          const summary=(buyerMap[c]||[]).find(b=>b.liftExtra&&b.nick===nick&&b.oid===oid);
          if(summary)summary.qty++;
          else (buyerMap[c]=buyerMap[c]||[]).push({nick,qty:1,all:false,bind:false,fixed:null,isLift:true,liftExtra:true,oid,ts:0,seq:Number.MAX_SAFE_INTEGER});
          left--;
        }
      }
    }
    const arrangedNeeded=Math.max(0,...p.contents.map(c=>remaining[c].length));
    boxesNeeded=p.maxBoxes?Math.min(arrangedNeeded,p.maxBoxes):arrangedNeeded;
    surplus=0;
    for(const c of p.contents)surplus+=Math.max(0,boxesNeeded-(demands[c]||0));
  }
  const frozenPins=p.frozenPins||{};
  const layoutPins=g.keepTableOrderOnDelete?(p.layoutPins||{}):{};
  const pins=p.pins||{};
  const reserved={};
  const pinLast=Math.max(-1,...[...Object.keys(frozenPins),...Object.keys(layoutPins),...Object.keys(pins)].map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite));
  if(pinLast>=boxesNeeded)boxesNeeded=pinLast+1;
  const reservePin=(key,spec,isFrozen)=>{
    const sep=key.indexOf('|||');
    const bi=parseInt(key.slice(0,sep)),item=key.slice(sep+3);
    if(isNaN(bi)||bi>=boxesNeeded||!remaining[item]||Object.prototype.hasOwnProperty.call(reserved,key))return;
    if(isFrozen&&!Object.prototype.hasOwnProperty.call(frozenPins,key))return;
    const pin=typeof spec==='string'?{nick:spec}:spec;
    if(pin&&pin.empty){reserved[key]=null;return;}
    if(isFrozen&&pin&&!pin.empty&&!pin.bind&&!g.fixEnded){
      const pinnedOrder=pin.oid?orderById.get(pin.oid):null;
      const pinnedPriority=pinnedOrder?boxOrderPriority(g,item,{...pinnedOrder,oid:pinnedOrder.id},team,admins):{cls:3,rank:0};
      const slotIdx=remaining[item].findIndex(u=>{
        if(!u||u.bind)return false;
        const candidateCls=u.priorityCls??3;
        if(candidateCls<0)return candidateCls<pinnedPriority.cls;
        return candidateCls===0&&(pinnedPriority.cls>0||((u.priorityRank||0)<(pinnedPriority.rank||0)));
      });
      if(slotIdx>=0){
        const u=remaining[item].splice(slotIdx,1)[0];
        for(const frozenKey of Object.keys(frozenPins)){
          const frozenSep=frozenKey.indexOf('|||');
          if(frozenSep<0||frozenKey.slice(frozenSep+3)!==item)continue;
          const frozenRow=parseInt(frozenKey.slice(0,frozenSep));
          if(Number.isFinite(frozenRow)&&frozenRow>=bi)delete frozenPins[frozenKey];
        }
        reserved[key]=u;
        frozenPins[key]={nick:u.nick,bind:false,oid:u.oid||0};
        return;
      }
    }
    if(isFrozen&&pin&&!pin.empty&&!pin.bind&&!team[pin.nick]){
      const pinnedOrder=pin.oid?orderById.get(pin.oid):null;
      const pinnedPriority=pinnedOrder?boxOrderPriority(g,item,{...pinnedOrder,oid:pinnedOrder.id},team,admins).cls:3;
      const memberIdx=remaining[item].findIndex(u=>u&&!u.bind&&team[u.nick]&&(u.priorityCls??3)<pinnedPriority);
      if(memberIdx>=0){
        const u=remaining[item].splice(memberIdx,1)[0];
        reserved[key]=u;
        frozenPins[key]={nick:u.nick,bind:false,oid:u.oid||0};
        return;
      }
    }
    let idx=-1;
    if(pin&&pin.oid)idx=remaining[item].findIndex(u=>u&&u.oid===pin.oid&&u.bind===!!pin.bind);
    else if(pin)idx=remaining[item].findIndex(u=>u&&u.nick===pin.nick&&!u.bind);
    if(idx<0&&pin&&!pin.oid)idx=remaining[item].findIndex(u=>u&&u.nick===pin.nick);
    if(idx>=0){const u=remaining[item].splice(idx,1)[0];if(!isFrozen)u.manual=true;reserved[key]=u;}
  };
  const frozenEntries=Object.entries(frozenPins);
  for(const[key,pin]of frozenEntries.filter(([,pin])=>pin&&!pin.empty&&team[pin.nick]))reservePin(key,pin,true);
  for(const[key,pin]of frozenEntries.filter(([,pin])=>!pin||pin.empty||!team[pin.nick]))reservePin(key,pin,true);
  for(const[key,pin]of Object.entries(layoutPins))reservePin(key,pin,true);
  for(const[key,nick]of Object.entries(pins))reservePin(key,nick,false);
  if(liftersOrder.length){
    const lifterSet=new Set(liftersOrder),bundles={};
    for(const item of p.contents){
      const keep=[];
      for(const unit of remaining[item]){
        if(unit&&lifterSet.has(unit.nick)&&(unit.isLift||unit.lifted||unit.liftExtra||unit.liftOverflow)){
          const byItem=bundles[unit.nick]||(bundles[unit.nick]={});
          (byItem[item]=byItem[item]||[]).push(unit);
        }else if(unit)keep.push(unit);
      }
      remaining[item]=keep;
    }
    let rowCursor=Math.max(0,lockN);
    for(const nick of liftersOrder){
      const byItem=bundles[nick]||{};
      if(g.status==='進行中'){
        const anchorRows=[...new Set(
          Object.entries(reserved)
            .filter(([,unit])=>unit&&unit.nick===nick&&(unit.isLift||unit.lifted||unit.liftExtra))
            .map(([key])=>parseInt(key.split('|||')[0]))
            .filter(Number.isFinite)
        )].sort((a,b)=>a-b);
        for(const row of anchorRows){
          for(const item of p.contents){
            const key=row+'|||'+item,current=reserved[key];
            if(current&&current.nick===nick&&(current.isLift||current.lifted||current.liftExtra))continue;
            const unit=(byItem[item]||[]).shift();
            if(!unit)continue;
            if(Object.prototype.hasOwnProperty.call(layoutPins,key)||Object.prototype.hasOwnProperty.call(pins,key)){
              (byItem[item]=byItem[item]||[]).unshift(unit);
              continue;
            }
            if(current)remaining[item].unshift(current);
            reserved[key]=unit;
            if(Object.prototype.hasOwnProperty.call(frozenPins,key)){
              frozenPins[key]={nick:unit.nick,bind:!!unit.bind,oid:unit.oid||0};
            }
          }
          rowCursor=Math.max(rowCursor,row+1);
        }
      }
      const count=Math.max(0,...p.contents.map(item=>(byItem[item]||[]).length));
      for(let i=0;i<count;i++){
        const parts=p.contents.map(item=>({item,unit:(byItem[item]||[])[i]})).filter(part=>part.unit);
        if(!parts.length)continue;
        let row=rowCursor;
        const limit=p.maxBoxes?Math.max(0,parseInt(p.maxBoxes)||0):Number.MAX_SAFE_INTEGER;
        while(row<limit&&parts.some(part=>Object.prototype.hasOwnProperty.call(reserved,row+'|||'+part.item)))row++;
        if(row>=limit){
          for(const part of parts)remaining[part.item].unshift(part.unit);
          continue;
        }
        for(const part of parts)reserved[row+'|||'+part.item]=part.unit;
        rowCursor=row+1;
      }
    }
  }
  let capacityNeeded=boxesNeeded;
  for(const c of p.contents){
    const occupied=Object.keys(reserved).filter(key=>key.endsWith('|||'+c)).length;
    const last=Math.max(-1,...Object.keys(reserved).filter(key=>key.endsWith('|||'+c)).map(key=>parseInt(key.split('|||')[0])).filter(Number.isFinite));
    capacityNeeded=Math.max(capacityNeeded,last+1,remaining[c].length+occupied);
  }
  boxesNeeded=p.maxBoxes?Math.max(pinLast+1,Math.min(capacityNeeded,p.maxBoxes)):capacityNeeded;
  surplus=0;
  for(const c of p.contents)surplus+=Math.max(0,boxesNeeded-(demands[c]||0));
  let complete=0,bindComplete=0;
  for(let i=0;i<boxesNeeded;i++){
    const box=p.contents.map(c=>{
      const key=i+'|||'+c;
      const buyer=Object.prototype.hasOwnProperty.call(reserved,key)?reserved[key]:(remaining[c].shift()||null);
      return {item:c,buyer};
    });
    const emptySlots=box.filter(s=>!s.buyer);
    box.bindPlan=getBoxBindPlan(p,box);
    if(!emptySlots.length){
      if(box.some(s=>s.buyer&&s.buyer.bind)){box.status='含綁成團';bindComplete++;}
      else{box.status='成團';complete++;}
    } else if(box.bindPlan.length===emptySlots.length){
      box.status='含綁成團';bindComplete++;
    } else box.status='未成團';
    boxes.push(box);
  }

  if(liftersOrder.length){
    const hasKey=(obj,key)=>Object.prototype.hasOwnProperty.call(obj||{},key);
    const protectedRow=row=>p.contents.some(item=>{
      const key=row+'|||'+item;
      return hasKey(frozenPins,key)||hasKey(layoutPins,key)||hasKey(pins,key);
    });
    const isBundleUnit=unit=>unit&&(unit.isLift||unit.lifted||unit.liftExtra||unit.liftOverflow);
    const pools={};
    for(let row=0;row<boxes.length;row++){
      if(protectedRow(row))continue;
      for(const slot of boxes[row]){
        const unit=slot.buyer;
        if(!isBundleUnit(unit))continue;
        const byItem=pools[unit.nick]||(pools[unit.nick]={});
        (byItem[slot.item]=byItem[slot.item]||[]).push({unit,row});
        slot.buyer=null;
      }
    }
    const liftTimes={};
    for(const o of g.orders){
      if(!o.lift||o.bind||!orderMatches(p,o))continue;
      const time=boxOrderTime(o);
      liftTimes[o.nick]=Math.min(liftTimes[o.nick]??Number.MAX_SAFE_INTEGER,time);
    }
    const bundles=[];
    for(const nick of liftersOrder){
      const byItem=pools[nick]||{};
      const count=Math.max(0,...p.contents.map(item=>(byItem[item]||[]).length));
      for(let index=0;index<count;index++){
        const parts=p.contents.map(item=>{
          const entry=(byItem[item]||[])[index];
          return entry?{item,unit:entry.unit,sourceRow:entry.row}:null;
        }).filter(Boolean);
        if(parts.length)bundles.push({nick,index,parts,time:liftTimes[nick]??Number.MAX_SAFE_INTEGER});
      }
    }
    const emptyBox=()=>p.contents.map(item=>({item,buyer:null}));
    const ensureRow=row=>{
      while(boxes.length<=row)boxes.push(emptyBox());
      return boxes[row];
    };
    const classify=box=>{
      const empties=box.filter(slot=>!slot.buyer);
      const plan=getBoxBindPlan(p,box);
      if(!empties.length)return box.some(slot=>slot.buyer?.bind)?2:3;
      return plan.length===empties.length?2:1;
    };
    const simulate=(bundle,row)=>{
      if(protectedRow(row))return null;
      const current=row<boxes.length?boxes[row]:emptyBox();
      const copy=current.map(slot=>({item:slot.item,buyer:slot.buyer}));
      for(const part of bundle.parts){
        const slot=copy.find(cell=>cell.item===part.item);
        if(!slot||slot.buyer?._liftPacked)return null;
        slot.buyer=part.unit;
      }
      return classify(copy);
    };
    const configuredLimit=Math.max(0,parseInt(p.maxBoxes)||0);
    const scheduleLimit=configuredLimit||Math.max(boxes.length+bundles.length+8,16);
    const displaced={};
    const pending=[...bundles];
    let cursor=0;
    while(pending.length){
      let selected=-1,chosen=-1,chosenScore=0;
      for(let index=0;index<pending.length;index++){
        const bundle=pending[index];
        let rowChoice=-1,bestScore=0;
        for(let row=cursor;row<scheduleLimit;row++){
          const score=simulate(bundle,row)||0;
          if(score>bestScore){bestScore=score;rowChoice=row;if(score===3)break;}
        }
        if(rowChoice<0)continue;
        const current=selected>=0?pending[selected]:null;
        if(selected<0||bestScore>chosenScore||
          (bestScore===chosenScore&&(bundle.time<current.time||
          (bundle.time===current.time&&bundle.index<current.index)))){
          selected=index;chosen=rowChoice;chosenScore=bestScore;
        }
      }
      if(selected<0)break;
      const bundle=pending.splice(selected,1)[0];
      const row=ensureRow(chosen);
      for(const part of bundle.parts){
        const slot=row.find(cell=>cell.item===part.item);
        if(slot.buyer){
          (displaced[part.item]=displaced[part.item]||[]).push({unit:slot.buyer,minRow:chosen+1});
        }
        part.unit._liftPacked=true;
        slot.buyer=part.unit;
      }
      cursor=chosen+1;
    }
    for(const item of p.contents){
      for(const entry of displaced[item]||[]){
        let placed=false;
        const limit=scheduleLimit;
        for(let row=entry.minRow;row<limit;row++){
          if(protectedRow(row))continue;
          const slot=ensureRow(row).find(cell=>cell.item===item);
          if(slot&&!slot.buyer){slot.buyer=entry.unit;placed=true;break;}
        }
        if(!placed&&!p.maxBoxes){
          const row=ensureRow(boxes.length);
          row.find(cell=>cell.item===item).buyer=entry.unit;
        }
      }
    }
    complete=0;bindComplete=0;
    for(const box of boxes){
      for(const slot of box)if(slot.buyer)delete slot.buyer._liftPacked;
      const emptySlots=box.filter(slot=>!slot.buyer);
      box.bindPlan=getBoxBindPlan(p,box);
      if(!emptySlots.length){
        if(box.some(slot=>slot.buyer&&slot.buyer.bind)){box.status='含綁成團';bindComplete++;}
        else{box.status='成團';complete++;}
      }else if(box.bindPlan.length===emptySlots.length){
        box.status='含綁成團';bindComplete++;
      }else box.status='未成團';
    }
    boxesNeeded=boxes.length;
    surplus=boxes.reduce((sum,box)=>sum+box.filter(slot=>!slot.buyer).length,0);
  }

  return {demands,buyerMap,maxDemand,minDemand,onlyAll,boxesNeeded,complete,bindComplete,surplus,boxes};
}

function renderItemsTab(g){
  let h=`<div class="card"><div class="card-header"><h3 style="margin:0">商品庫存</h3>
    <button class="bs bp" onclick="showAddItemModal(${g.id})">新增商品</button></div>
    <p class="muted" style="margin-bottom:8px">設定庫存後，帶多計算才能分配</p>`;
  if(!(g.items||[]).length){h+=`<div class="empty">尚未設定</div>`;}

function buildMemberPaymentOverview(nick){

    const computed=orders.reduce((sum,o)=>sum+o.qty*effPrice(g,o),0);
    const rec=(g.pay||{})[nick]||{};
    const total=payTotal(g,nick,computed),paid=Number(rec.paid)||0,diff=total-paid;
    rows.push({gid:g.id,name:g.name,status:g.status,createdAt:g.createdAt||'',computed,total,paid,diff,isOverride:rec.totalOv!=null});
  }
  rows.sort((a,b)=>(b.diff>0?1:0)-(a.diff>0?1:0)||b.createdAt.localeCompare(a.createdAt)||b.gid-a.gid);
  return {
    rows,
    total:rows.reduce((sum,row)=>sum+row.total,0),
    paid:rows.reduce((sum,row)=>sum+row.paid,0),
    due:rows.reduce((sum,row)=>sum+Math.max(0,row.diff),0)

function calculateSecondPaymentValues(g,total,ratios=null,excludedNicks=null){
  ratios=ratios||{};excludedNicks=excludedNicks||[];
  const excluded=new Set(excludedNicks||[]),orders=getConfirmedOrders(g).filter(o=>!excluded.has(o.nick));
  const rows=(g.boxProducts||[]).map(product=>{
    const qty=orders.filter(o=>orderMatches(product,o)&&product.contents.includes(o.item)).reduce((sum,o)=>sum+Math.max(0,Number(o.qty)||0),0);
    const ratio=Math.max(0,Number(ratios[product.id])||0);
    return {pid:product.id,name:product.name,qty,ratio,surcharge:0,subtotal:0};
  });
  const weightedTotal=rows.reduce((sum,row)=>sum+row.qty*row.ratio,0),amount=Math.max(0,Number(total)||0);
  for(const row of rows){
    row.surcharge=weightedTotal?Math.ceil(amount*row.ratio/weightedTotal):0;
    row.subtotal=row.surcharge*row.qty;
  }
  return {rows,weightedTotal,allocated:rows.reduce((sum,row)=>sum+row.subtotal,0)};
}
function readSecondPaymentCalculator(gid){
  const g=getG(gid);if(!g)return null;
  const ratios={};
  document.querySelectorAll('.secondPaymentRatio').forEach(input=>{ratios[input.dataset.pid]=Math.max(0,Number(input.value)||0);});
  const excluded=[...document.querySelectorAll('.secondPaymentExcluded:checked')].map(input=>input.value);
  return {g,total:Math.max(0,Number($('#secondPaymentTotal')?.value)||0),ratios,excluded};
}
function refreshSecondPaymentCalculator(gid,keepManual=false){
  const input=readSecondPaymentCalculator(gid);if(!input)return null;
  const result=calculateSecondPaymentValues(input.g,input.total,input.ratios,input.excluded);
  for(const row of result.rows){
    const qty=$(`#secondPaymentQty_${row.pid}`),value=$(`#secondPaymentValue_${row.pid}`),subtotal=$(`#secondPaymentSubtotal_${row.pid}`);
    if(keepManual&&value)row.surcharge=Math.max(0,Math.ceil(Number(value.value)||0));
    row.subtotal=row.surcharge*row.qty;
    if(qty)qty.textContent=row.qty.toLocaleString();
    if(value&&!keepManual)value.value=row.surcharge;
    if(subtotal)subtotal.textContent=row.subtotal?`$${row.subtotal.toLocaleString()}`:'-';
  }
  result.allocated=result.rows.reduce((sum,row)=>sum+row.subtotal,0);
  const summary=$('#secondPaymentSummary');
  if(summary)summary.textContent=result.weightedTotal?`分攤合計 $${result.allocated.toLocaleString()}`:'請輸入總金額、商品比值，並確認有可計算的商品數量';
  return {...input,result};
}

    for(const[nick,computed]of sorted){
      const p=pay[nick]||{paid:0,note:''};
      const total=payTotal(g,nick,computed);
      const isOv=p.totalOv!=null;
      const diff=total-(p.paid||0);
      const st=paymentStatusHtml(p.paid,diff);
      h+=`<tr><td>${team[nick]?`<span style="color:#a32d2d;font-weight:bold">${esc(nick)}</span>`:esc(nick)}</td>
        <td>$${total.toLocaleString()}${isOv?'<span style="color:#d16277;font-weight:bold">*</span>':''}</td><td>${p.paid?'$'+p.paid.toLocaleString():'-'}</td><td>${st}</td>
        <td class="muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.note||'')}</td>
        ${RO?'':`<td class="muted" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8a75c9">${esc(getLocalPayNote(g.id,nick))}</td>
        <td><button class="bs bg" onclick="showPayModal(${g.id},'${encodeURIComponent(nick)}')">編輯</button></td>`}</tr>`;
    }
    h+=`</tbody></table></div>`;
  }
  h+=`</div>`;return h;
}
function showPayModal(gid,nickEnc,returnView=''){

function fillPayPrivateNote(value){
  const input=$('#payPNote');
  if(!input)return;

function savePay(gid,nickEnc,computed,returnView=''){
  const nick=decodeURIComponent(nickEnc);
  const paid=parseFloat($('#payAmt').value)||0;
  const note=$('#payNote').value.trim();
  const pnote=$('#payPNote').value.trim();
  const totalIn=parseFloat($('#payTotal').value);
  upG(gid,g=>{
    if(!g.pay)g.pay={};
    const rec={paid,note};
    if(!isNaN(totalIn)&&totalIn!==computed)rec.totalOv=totalIn;
    g.pay[nick]=rec;
  });
  updateLocalPayNote(gid,nick,pnote);
  closeModal();render();
  if(returnView==='memberOverview')showMemberPaymentOverview(encodeURIComponent(nick));
}

function markArrival(g,newStatus){
  const arrived=['已到貨','已結團'].includes(newStatus);
  if(arrived&&!g.arrivedAt)g.arrivedAt=Date.now();
  if(!arrived&&g.arrivedAt)delete g.arrivedAt;
}
function saveGroupSettings(id){

    g.status=$('#gsStatus').value;

    const av=$('#gsArrived')?.value;

function downloadXlsxTable(tableHtml,fileName,sheetName){
  const holder=document.createElement('div');holder.innerHTML=tableHtml;
  const table=holder.querySelector('table');if(!table){alert('沒有可匯出的資料');return;}
  const blob=xlsxBlobFromTable(table,sheetName),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=String(fileName||'export').replace(/[\\/:*?"<>|]/g,'_')+'.xlsx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function embeddedMyShipTemplate(){
  if(!MYSHIP_TEMPLATE_BASE64||MYSHIP_TEMPLATE_BASE64.startsWith('__'))return null;
  const binary=atob(MYSHIP_TEMPLATE_BASE64),bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return bytes;
}
const MYSHIP_TEMPLATE_DB='myuji-myship-template';
const MYSHIP_TEMPLATE_STORE='files';
function openMyShipTemplateDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error('這個瀏覽器無法保存範本'));return;}
    const request=indexedDB.open(MYSHIP_TEMPLATE_DB,1);
    request.onupgradeneeded=()=>{
      if(!request.result.objectStoreNames.contains(MYSHIP_TEMPLATE_STORE))request.result.createObjectStore(MYSHIP_TEMPLATE_STORE);
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('無法開啟範本儲存空間'));
  });
}
async function getSavedMyShipTemplateRecord(){
  try{
    const db=await openMyShipTemplateDB();
    const record=await new Promise((resolve,reject)=>{
      const request=db.transaction(MYSHIP_TEMPLATE_STORE,'readonly').objectStore(MYSHIP_TEMPLATE_STORE).get('official');
      request.onsuccess=()=>resolve(request.result||null);
      request.onerror=()=>reject(request.error||new Error('無法讀取已保存的範本'));
    });
    db.close();return record;
  }catch(e){return null;}
}
async function saveMyShipTemplateRecord(bytes,name){
  const db=await openMyShipTemplateDB();
  await new Promise((resolve,reject)=>{
    const transaction=db.transaction(MYSHIP_TEMPLATE_STORE,'readwrite');
    transaction.objectStore(MYSHIP_TEMPLATE_STORE).put({bytes,name,updatedAt:Date.now()},'official');
    transaction.oncomplete=resolve;
    transaction.onerror=()=>reject(transaction.error||new Error('無法保存範本'));
    transaction.onabort=()=>reject(transaction.error||new Error('無法保存範本'));
  });
  db.close();
}
async function refreshMyShipTemplateStatus(){
  const status=document.getElementById('myShipTemplateStatus');if(!status)return;
  const record=await getSavedMyShipTemplateRecord();
  if(!document.body.contains(status))return;
  status.textContent=record?.bytes?`目前使用：${record.name||'已更新範本'}`:'目前使用：內建範本';
}
async function updateMyShipTemplate(input,gid,scope){
  const file=input.files?.[0];if(!file)return;
  try{
    const bytes=new Uint8Array(await file.arrayBuffer()),files=await readOfficeZipFiles(bytes);
    if(!files['xl/worksheets/sheet2.xml']||!files['xl/vbaProject.bin'])throw new Error('請選擇賣貨便官方 .xlsm 範本');
    await saveMyShipTemplateRecord(bytes,file.name);
    alert('官方範本已更新，之後會自動使用這個版本');
    showMyShipListingExportModal(gid,scope);
  }catch(e){
    alert(`範本更新失敗：${e.message||e}`);
  }finally{input.value='';}
}
function myShipSafeText(value,maxLength){
  return String(value||'').replace(/[&()=;'"<>\\]/g,'').trim().slice(0,maxLength);
}
function myShipScopeMatches(nick,scope){
  const isMember=!!getTeam()[nick];
  return scope==='member'?isMember:scope==='nonmember'?!isMember:true;
}
function buildMyShipListingRows(g,scope='all'){
  const confirmed=getConfirmedOrders(g).filter(order=>myShipScopeMatches(order.nick,scope)),byNick={};
  for(const o of confirmed){
    if(!byNick[o.nick])byNick[o.nick]={computed:0,surcharge:0};
    byNick[o.nick].computed+=Math.max(0,Number(o.qty)||0)*effPrice(g,o);
    const product=(g.boxProducts||[]).find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
    if(!(g.secondPaymentExcludedNicks||[]).includes(o.nick))byNick[o.nick].surcharge+=Math.max(0,Number(product?.surcharge)||0)*Math.max(0,Number(o.qty)||0);
  }
  return Object.entries(byNick).map(([nick,row])=>{
    const due=payTotal(g,nick,row.computed),paid=Math.max(0,Number((g.pay||{})[nick]?.paid)||0);
    const balance=Math.ceil(row.surcharge+due-paid),refund=balance<0?Math.abs(balance):0,price=balance>0?balance:10;
    const suffix=refund?`（內退${refund}）`:'';
    return {nick,spec:myShipSafeText(nick,Math.max(0,25-suffix.length))+suffix,price,balance,refund,due,paid,surcharge:row.surcharge};
  }).sort((a,b)=>a.nick.localeCompare(b.nick,'zh-Hant'));
}
function showMyShipListingExportModal(gid,scope='member'){
  if(RO)return;
  const g=getG(gid);if(!g)return;
  const rows=buildMyShipListingRows(g,scope),scopeButton=(value,label)=>`<button class="${scope===value?'bp':''}" onclick="showMyShipListingExportModal(${gid},'${value}')">${label}</button>`;
  const choices=rows.map(row=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0"><input class="myShipListingNick" type="checkbox" value="${esc(row.nick)}" checked style="width:16px;height:16px;min-width:16px;padding:0;margin:0;flex:0 0 16px"><span title="${esc(row.nick)}" style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(row.nick)}</span><strong style="margin-left:auto;white-space:nowrap">$${row.price.toLocaleString()}</strong></label>`).join('');
  openModal(`<h3>匯出賣貨便上架檔</h3>

async function readOfficeZipFiles(bytes){
  const view=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),decoder=new TextDecoder();let end=-1;
  for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(view.getUint32(i,true)===0x06054b50){end=i;break;}
  if(end<0)throw new Error('無法讀取賣貨便範本');
  const count=view.getUint16(end+10,true),cdOffset=view.getUint32(end+16,true),files={};let pos=cdOffset;
  for(let i=0;i<count;i++){
    if(view.getUint32(pos,true)!==0x02014b50)throw new Error('賣貨便範本格式不完整');
    const method=view.getUint16(pos+10,true),compressedSize=view.getUint32(pos+20,true),nameLength=view.getUint16(pos+28,true),extraLength=view.getUint16(pos+30,true),commentLength=view.getUint16(pos+32,true),localOffset=view.getUint32(pos+42,true);
    const name=decoder.decode(bytes.slice(pos+46,pos+46+nameLength));
    const localNameLength=view.getUint16(localOffset+26,true),localExtraLength=view.getUint16(localOffset+28,true),start=localOffset+30+localNameLength+localExtraLength,compressed=bytes.slice(start,start+compressedSize);
    if(method===0)files[name]=compressed;
    else if(method===8){
      const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      files[name]=new Uint8Array(await new Response(stream).arrayBuffer());
    }else throw new Error('賣貨便範本含有不支援的壓縮格式');
    pos+=46+nameLength+extraLength+commentLength;
  }
  return files;
}
function myShipCell(ref,value,style){

}
function myShipProductDescription(g){

function fillMyShipTemplate(files,g,rows){
  const decoder=new TextDecoder(),encoder=new TextEncoder(),singlePath='xl/worksheets/sheet1.xml',doublePath='xl/worksheets/sheet2.xml';
  let singleXml=decoder.decode(files[singlePath]),singleBody=singleXml.match(/<sheetData>([\s\S]*?)<\/sheetData>/)?.[1]||'';
  const singleFixedRows=[...singleBody.matchAll(/<row\b[\s\S]*?<\/row>/g)].map(match=>match[0]).filter(row=>Number(row.match(/\br="(\d+)"/)?.[1])<=6).join('');
  singleXml=singleXml.replace(/<sheetData>[\s\S]*?<\/sheetData>/,`<sheetData>${singleFixedRows}</sheetData>`).replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:L6"/>');
  files[singlePath]=encoder.encode(singleXml);

  let xml=decoder.decode(files[doublePath]),body=xml.match(/<sheetData>([\s\S]*?)<\/sheetData>/)?.[1]||'';
  const fixedRows=[...body.matchAll(/<row\b[\s\S]*?<\/row>/g)].map(match=>match[0]).filter(row=>Number(row.match(/\br="(\d+)"/)?.[1])<=6).join('');
  const name=myShipSafeText(g.name,60)||'團購下單',description=myShipProductDescription(g);
  const specs=rows.map(row=>row.spec).join('\n'),quantities=rows.map(()=>1).join('\n'),prices=rows.map(row=>row.price).join('\n');
  const rowHeight=Math.min(409,Math.max(67.5,rows.length*15));
  const data=`<row r="7" spans="1:15" ht="${rowHeight}" customHeight="1">${myShipCell('A7',name,42)}${myShipCell('B7','',40)}${myShipCell('C7',description,40)}${myShipCell('D7','暱稱',41)}${myShipCell('E7',specs,40)}${myShipCell('F7','款項',41)}${myShipCell('G7','二補',40)}${myShipCell('H7',quantities,40)}${myShipCell('I7',prices,40)}${myShipCell('J7','',41)}${myShipCell('K7','新品',41)}${myShipCell('L7','1',41)}${myShipCell('M7','1',41)}${myShipCell('N7','驗證通過',40)}</row>`;
  xml=xml.replace(/<sheetData>[\s\S]*?<\/sheetData>/,`<sheetData>${fixedRows}${data}</sheetData>`).replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:O7"/>');
  files[doublePath]=encoder.encode(xml);return files;
}
async function exportMyShipListing(gid,scope,selectedNicks=null){
  if(RO)return;
  const g=getG(gid);if(!g)return;
  const label=scope==='member'?'團員':'非團員',selected=selectedNicks?new Set(selectedNicks):null;
  const rows=buildMyShipListingRows(g,scope).filter(row=>!selected||selected.has(row.nick));

  if(rows.length>50){alert(`目前共有 ${rows.length} 個暱稱規格，賣貨便單一商品最多 50 個規格，請先拆成不同賣場。`);return;}
  const duplicate=rows.find((row,index)=>rows.some((other,i)=>i<index&&other.spec===row.spec));
  if(duplicate){alert(`規格名稱「${duplicate.spec}」重複或截短後相同，請先調整暱稱。`);return;}

  try{

    const files=fillMyShipTemplate(await readOfficeZipFiles(template),g,rows);

  }catch(error){alert('匯出失敗：'+(error?.message||error));}
}

function buildProcurementRows(g){
  const rows=[];
  const confirmed=getConfirmedOrders(g);
  for(const p of(g.boxProducts||[])){
    if(p.kind==='single'){
      const quantities={};
      for(const o of confirmed){
        if(!p.contents.includes(o.item)||!orderMatches(p,o))continue;
        quantities[o.item]=(quantities[o.item]||0)+Math.max(0,parseInt(o.qty)||0);
      }
      for(const item of p.contents){
        const qty=quantities[item]||0;
        if(qty)rows.push({type:'單領',product:p.name,item,qty,unit:'個'});
      }
      continue;
    }
    const info=calcBoxes(g,p);
    const qty=info.boxes.filter(box=>box.status==='成團'||box.status==='含綁成團').length;
    if(qty)rows.push({type:'拆團',product:p.name,item:'',qty,unit:'盒'});
  }
  return rows;
}

function buildSecondPaymentRows(g){
  const byNick={};
  for(const o of getConfirmedOrders(g)){
    if(!byNick[o.nick])byNick[o.nick]={computed:0,surcharge:0};
    const row=byNick[o.nick];
    row.computed+=Math.max(0,parseInt(o.qty)||0)*effPrice(g,o);
    const product=(g.boxProducts||[]).find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
    if(!(g.secondPaymentExcludedNicks||[]).includes(o.nick))row.surcharge+=Math.max(0,Number(product?.surcharge)||0)*Math.max(0,parseInt(o.qty)||0);
  }
  const pay=g.pay||{},team=getTeam();
  return Object.entries(byNick).map(([nick,row])=>{
    const due=payTotal(g,nick,row.computed),paid=Math.max(0,Number(pay[nick]?.paid)||0);
    const overpaid=Math.max(0,paid-due),total=row.surcharge-overpaid;
    return{nick,isMember:!!team[nick],surcharge:row.surcharge,overpaid,total};
  }).filter(row=>row.surcharge>0||row.overpaid>0)
    .sort((a,b)=>(b.isMember?1:0)-(a.isMember?1:0)||b.total-a.total||a.nick.localeCompare(b.nick,'zh-Hant'));
}

function exportSummaryXls(gid,scope='all'){
  const g=getG(gid);if(!g)return;
  const bps=g.boxProducts||[];
  if(!bps.length){alert('尚無商品');return;}
  const confirmed=getConfirmedOrders(g);
  const pay=g.pay||{};
  const ship=g.ship||{};

  const byNick={};
  for(const o of confirmed){
    if(!byNick[o.nick])byNick[o.nick]={perBp:{},total:0,keys:[]};
    const b=byNick[o.nick];
    const bp=bps.find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
    const bpKey=bp?bp.id:'_none';
    if(!b.perBp[bpKey])b.perBp[bpKey]={};
    b.perBp[bpKey][o.item]=(b.perBp[bpKey][o.item]||0)+o.qty;
    b.total+=o.qty*effPrice(g,o);
    b.keys.push(`${o.bpId||''}|||${o.item}|||${o.bind?1:0}|||${o.nick}`);
  }
  const team=getTeam();
  const sortedNicks=Object.keys(byNick).sort((a,b)=>byNick[b].total-byNick[a].total);
  const memberNicks=sortedNicks.filter(n=>Object.prototype.hasOwnProperty.call(team,n));
  const nonmemberNicks=sortedNicks.filter(n=>!Object.prototype.hasOwnProperty.call(team,n));
  const nicks=scope==='member'?memberNicks:scope==='nonmember'?nonmemberNicks:[...memberNicks,...nonmemberNicks];
  const sections=scope==='all'?[{label:'團員',nicks:memberNicks},{label:'非團員',nicks:nonmemberNicks}]:[{label:'',nicks}];

  const css=`<style>
    td,th{border:1px solid #bbb;padding:4px 8px;font-size:11pt;font-family:Arial,sans-serif;white-space:nowrap}

    .ctr{text-align:center}
    .num{text-align:right}
    .due{background:#f8cecc;color:#cc0000;font-weight:bold;text-align:right}
