  </style>`;

  let html=`<table cellspacing="0">
    <tr><td colspan="${bps.length+6}" style="font-size:14pt;font-weight:bold;border:none">${esc(g.name)} — ${title}</td></tr>
    <tr><th>暱稱</th>${bps.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th>總金額</th><th>已付金額</th><th>餘款</th><th>出貨狀況</th><th>備註</th></tr>`;
  for(const section of sections){

    for(const nick of section.nicks){
      const b=byNick[nick];
      const paid=(pay[nick]&&pay[nick].paid)||0;
      const total=payTotal(g,nick,b.total);
      const isOv=pay[nick]&&pay[nick].totalOv!=null;
      const diff=total-paid;
      const allShipped=b.keys.length&&b.keys.every(k=>ship[k]&&ship[k].s);
      html+=`<tr><td class="ctr" style="font-weight:bold">${esc(nick)}</td>`;
      for(const p of bps){
        const items=b.perBp[p.id]||{};
        const cell=Object.entries(items).map(([item,qty])=>{

        }).join('、');
        html+=`<td class="ctr">${cell||''}</td>`;
      }
      html+=`<td class="num">${total.toLocaleString()}${isOv?'*':''}</td>

  html+=`<tr><td class="ctr" style="font-weight:bold">總計</td>${bps.map(()=>'<td></td>').join('')}

function buildPaymentImageData(g,scope='all',selectedNicks=null,unpaidAudience='all'){
  const bps=g.boxProducts||[],byNick={};
  for(const o of getConfirmedOrders(g)){
    if(!byNick[o.nick])byNick[o.nick]={perBp:{},total:0};
    const b=byNick[o.nick],bp=bps.find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
    const bpKey=bp?bp.id:'_none';
    if(!b.perBp[bpKey])b.perBp[bpKey]={};
    b.perBp[bpKey][o.item]=(b.perBp[bpKey][o.item]||0)+o.qty;
    b.total+=o.qty*effPrice(g,o);
  }
  const team=getTeam();
  const sorted=Object.keys(byNick).sort((a,b)=>byNick[b].total-byNick[a].total||a.localeCompare(b,'zh-Hant'));
  const members=sorted.filter(n=>Object.prototype.hasOwnProperty.call(team,n));
  const nonmembers=sorted.filter(n=>!Object.prototype.hasOwnProperty.call(team,n));
  const selected=Array.isArray(selectedNicks)?new Set(selectedNicks):null;
  const isUnpaid=scope==='unpaid';
  const makeRows=nicks=>nicks.filter(nick=>!selected||selected.has(nick)).map(nick=>{
    const due=payTotal(g,nick,byNick[nick].total);
    const unpaid=Math.max(0,due-(Number((g.pay||{})[nick]?.paid)||0));
    return {nick,
    products:bps.map(p=>Object.entries(byNick[nick].perBp[p.id]||{}).map(([item,qty])=>{
      const single=p.contents.length===1&&p.contents[0]===p.name;
      return `${single?'':item}${qty}`;
    }).join('、')),
    total:isUnpaid?unpaid:due};
  }).filter(row=>!isUnpaid||row.total>0);
  const unpaidNicks=unpaidAudience==='member'?members:unpaidAudience==='nonmember'?nonmembers:sorted;
  const sections=isUnpaid?[{label:'',rows:makeRows(unpaidNicks)}]
    :scope==='member'?[{label:'',rows:makeRows(members)}]
    :scope==='nonmember'?[{label:'',rows:makeRows(nonmembers)}]
    :[{label:'團員',rows:makeRows(members)},{label:'非團員',rows:makeRows(nonmembers)}];
  const visibleSections=sections.filter(s=>s.rows.length);
  const visibleIndexes=bps.map((_,index)=>index).filter(index=>visibleSections.some(section=>section.rows.some(row=>row.products[index])));
  const visibleBps=visibleIndexes.map(index=>bps[index]);
  for(const section of visibleSections)for(const row of section.rows)row.products=visibleIndexes.map(index=>row.products[index]);
  return {bps:visibleBps,sections:visibleSections,title:scope==='member'?'團員':scope==='nonmember'?'非團員':isUnpaid?'未匯款名單':'總表',amountLabel:isUnpaid?'未匯金額':'總金額'};
}

function paymentImageTextLines(ctx,text,maxWidth){
  const value=String(text??'');if(!value)return [''];
  const lines=[];let line='';
  for(const char of value){
    if(line&&ctx.measureText(line+char).width>maxWidth){lines.push(line);line=char;}
    else line+=char;
  }
  if(line)lines.push(line);
  return lines;
}

async function exportPaymentImage(gid,scope='all',selectedNicks=null,unpaidAudience='all'){
  const g=getG(gid);if(!g||!['box','basic'].includes(g.type))return;
  const data=buildPaymentImageData(g,scope,selectedNicks,unpaidAudience);
  if(!data.bps.length){alert('尚無商品');return;}
  if(!data.sections.length){alert('目前沒有可匯出的資料');return;}
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;

  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  const font='15px "Microsoft JhengHei","PingFang TC",sans-serif';
  ctx.font=font;
  const headers=['暱稱',...data.bps.map(p=>p.name),data.amountLabel];
  const allRows=data.sections.flatMap(s=>s.rows);
  const rawColumns=headers.map((header,i)=>[header,...allRows.map(row=>i===0?row.nick:i===headers.length-1?'$'+row.total.toLocaleString():row.products[i-1])]);
  const widths=rawColumns.map((values,i)=>{
    const measured=Math.max(...values.map(v=>ctx.measureText(String(v||'')).width))+28;
    const min=i===0?110:i===headers.length-1?110:100;
    const max=i===0?190:i===headers.length-1?130:190;
    return Math.max(min,Math.min(max,measured));
  });
  const margin=28,titleHeight=66,headerHeight=46,lineHeight=22,padY=10;
  const preparedSections=data.sections.map(section=>({label:section.label,rows:section.rows.map(row=>{
    const values=[row.nick,...row.products,'$'+row.total.toLocaleString()];
    const lines=values.map((value,i)=>paymentImageTextLines(ctx,value,widths[i]-20));
    return {lines,height:Math.max(44,Math.max(...lines.map(x=>x.length))*lineHeight+padY*2)};
  })}));
  const tableWidth=widths.reduce((sum,w)=>sum+w,0);
  const logicalWidth=tableWidth+margin*2;
  const logicalHeight=margin+titleHeight+headerHeight+preparedSections.reduce((sum,s)=>sum+(s.label?38:0)+s.rows.reduce((n,r)=>n+r.height,0),0)+margin;
  const ratio=Math.max(.5,Math.min(2,16000/logicalWidth,16000/logicalHeight,Math.sqrt(30000000/(logicalWidth*logicalHeight))));
  canvas.width=Math.ceil(logicalWidth*ratio);canvas.height=Math.ceil(logicalHeight*ratio);ctx.scale(ratio,ratio);

  const colors={bg:'#fffafb',title:'#684f59',head:'#d8a7b7',headText:'#fffdfd',section:'#f2dfe6',row:'#fffdfd',alt:'#fcf4f7',grid:'#ead5dd',text:'#5d4850'};
  ctx.fillStyle=colors.bg;ctx.fillRect(0,0,logicalWidth,logicalHeight);
  ctx.fillStyle=colors.title;ctx.font='bold 24px "Microsoft JhengHei","PingFang TC",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(g.name,margin,margin+25);
  let y=margin+titleHeight,x=margin;
  ctx.font='bold 15px "Microsoft JhengHei","PingFang TC",sans-serif';
  for(let i=0;i<headers.length;i++){
    ctx.fillStyle=colors.head;ctx.fillRect(x,y,widths[i],headerHeight);
    ctx.strokeStyle=colors.grid;ctx.strokeRect(x,y,widths[i],headerHeight);
    ctx.fillStyle=colors.headText;ctx.textAlign='center';ctx.fillText(headers[i],x+widths[i]/2,y+headerHeight/2);x+=widths[i];
  }
  y+=headerHeight;let rowIndex=0;
  for(const section of preparedSections){
    if(section.label){
      ctx.fillStyle=colors.section;ctx.fillRect(margin,y,tableWidth,38);ctx.strokeStyle=colors.grid;ctx.strokeRect(margin,y,tableWidth,38);
      ctx.fillStyle=colors.title;ctx.textAlign='left';ctx.font='bold 15px "Microsoft JhengHei","PingFang TC",sans-serif';ctx.fillText(section.label,margin+12,y+19);y+=38;
    }
    for(const row of section.rows){
      x=margin;ctx.font=font;
      for(let i=0;i<row.lines.length;i++){
        ctx.fillStyle=rowIndex%2?colors.alt:colors.row;ctx.fillRect(x,y,widths[i],row.height);
        ctx.strokeStyle=colors.grid;ctx.strokeRect(x,y,widths[i],row.height);
        ctx.fillStyle=colors.text;ctx.textAlign=i===headers.length-1?'right':i===0?'left':'center';
        const tx=i===headers.length-1?x+widths[i]-10:i===0?x+10:x+widths[i]/2;
        const blockHeight=row.lines[i].length*lineHeight,startY=y+(row.height-blockHeight)/2+lineHeight/2;
        row.lines[i].forEach((line,k)=>ctx.fillText(line,tx,startY+k*lineHeight));x+=widths[i];
      }
      y+=row.height;rowIndex++;
    }
  }
  const fileName=String(scope==='unpaid'?`${g.name}_未匯款名單`:`${g.name}_收款${data.title}`).replace(/[\\/:*?"<>|]/g,'_')+'.png';
  if(canvas.toBlob)canvas.toBlob(blob=>blob?showPaymentImagePreview(blob,fileName,true,logicalWidth):alert('圖片匯出失敗'),'image/png');
  else showPaymentImagePreview(canvas.toDataURL('image/png'),fileName,false,logicalWidth);
}

function bulkAdd(id){
  const text=$('#bulkIn').value.trim();if(!text)return;
  const lines=text.split('\n').filter(l=>l.trim());
  const g=getG(id);
  const parsed=[];
  const dupCheck={};
  for(const line of lines){
    const p=line.split(/[\/,，]/).map(s=>s.trim());if(p.length<2)continue;
    const nick=p[0],item=p[1];
    const bp=(g.boxProducts||[]).find(b=>b.contents.includes(item));
    const bpId=bp?bp.id:null;
    const key=nick+'|||'+item+'|||'+(bpId||'');
    const alreadyOrdered=!!dupCheck[key]||g.orders.some(o=>!o.bind&&o.nick===nick&&o.item===item&&(o.bpId||null)===bpId);
    if(alreadyOrdered&&!confirm(`${nick} 已經喊過「${item}」，仍要再新增嗎？`))return;
    dupCheck[key]=true;
    parsed.push(p);
  }
  let c=0;
  upG(id,g=>{
    const affected=new Set();
    for(const row of parsed){
      const product=(g.boxProducts||[]).find(b=>b.contents.includes(row[1]));
      if(product&&product.kind!=='single'&&!affected.has(product.id)){
        freezeConfirmedBoxes(g,product);affected.add(product.id);
      }
    }
    for(const p of parsed){
    const bp=(g.boxProducts||[]).find(b=>b.contents.includes(p[1]));
    const bpId=bp?bp.id:null;
    if(bp)clearAutoBindOrders(g,bp,p[1],parseInt(p[2])||1);
    const manualPrice=parseFloat(p[3])||0;
    const price=manualPrice||lookupPrice(g,p[1],bpId)||0;
    g.orders.push({id:g.nOid++,nick:p[0],item:p[1],series:'',qty:parseInt(p[2])||1,price,note:'',bpId,ts:Date.now()});c++;
  }});
  if(c){alert(`匯入 ${c} 筆`);render();}
}

function checkStock(g,itemName,addQty){
  if(g.type!=='carry')return null;
  const it=(g.items||[]).find(i=>i.name===itemName);
  if(!it||!it.stock)return null;
  const used=g.orders.filter(o=>o.item===itemName).reduce((s,o)=>s+o.qty,0);
  const remain=it.stock-used;
  if(addQty>remain) return {item:itemName,stock:it.stock,used,remain};
  return null;
}
function addMultiOrder(){
  const nick=$('#mON').value.trim();const _s=S();
  if(!nick){alert(`請填${_s.fieldNick}`);return;}
  const g=getG(_mGid);
  const rows=$('#mORows').querySelectorAll('.form-row');
  const entries=[];
  for(const row of rows){
    const itemEl=row.querySelector('.moI');
    const item=(itemEl?.value||'').trim();
    if(!item)continue;
    const bpEl=row.querySelector('.moBp');
    const bpId=bpEl?parseInt(bpEl.value)||null:null;
    const all=row.querySelector('.moAll')?.dataset.all==='1';
    const qty=all?1:(parseInt(row.querySelector('.moQ')?.value)||1);
    const priceEl=row.querySelector('.moP');
    const price=priceEl?parseFloat(priceEl.value)||0:lookupPrice(g,item,bpId)||0;
    const note=(row.querySelector('.moNote')?.value||'').trim();
    const memberPriority=!!getTeam()[nick]&&!!row.querySelector('.moMemberPriority')?.checked&&!usesLegacyClosedRules(g);
    const cancelFixed=orderHasFixedSlot(nick,item)&&!!row.querySelector('.moCancelFixed')?.checked;
    entries.push({item,qty,all,price,note,bpId,memberPriority,cancelFixed});
  }
  if(!entries.length){alert(`請至少填一筆${_s.fieldItem}`);return;}
  const seen=new Set();
  for(const e of entries){
    const key=e.item+'|||'+(e.bpId||'');
    const alreadyOrdered=seen.has(key)||g.orders.some(o=>!o.bind&&o.nick===nick&&o.item===e.item&&(o.bpId||null)===(e.bpId||null));
    if(alreadyOrdered&&!confirm(`${nick} 已經喊過「${e.item}」，仍要再新增嗎？`))return;
    seen.add(key);

  }
  const isLift=!!$('#mOLift')?.checked;
  const liftCount=isLift?Math.max(0,parseInt($('#mOLiftCount')?.value)||0):0;
  const liftTargets=isLift?checkedLiftTargetIds('.mLiftTarget'):[];
  if(isLift){
    if(!liftTargets.length){alert('請至少指定一筆要提配的喊單');return;}
    for(const e of entries){
      const p=e.bpId?(g.boxProducts||[]).find(b=>b.id===e.bpId):(g.boxProducts||[]).find(b=>b.contents.includes(e.item));
      if(!p){alert(`「${e.item}」未對應任何商品，無法帶餘提配`);return;}
      if(!hasUnconfirmedOrders(g,p,nick)){alert(`${nick} 在「${p.name}」沒有可提配的喊單，無法提配`);return;}
      const candidateIds=new Set(getLiftCandidateOrders(g,p,nick).map(o=>o.id));
      if(!liftTargets.some(id=>candidateIds.has(id))){alert(`請替「${p.name}」至少指定一筆目前可提配的喊單`);return;}
    }
  }
  const contact=$('#mOContact')?.value.trim()||'';
  const url=$('#mOUrl')?.value.trim()||'';
  if(contact||url||_mShots.length)updateBuyer(_mGid,nick,contact,url,_mShots);
  upG(_mGid,g=>{
    if(isLift)g.orderRulesVersion=2;
    const affected=new Set();
    for(const e of entries){
      const product=e.bpId?(g.boxProducts||[]).find(b=>b.id===e.bpId):(g.boxProducts||[]).find(b=>b.contents.includes(e.item));
      if(product&&product.kind!=='single'&&!affected.has(product.id)){
        freezeConfirmedBoxes(g,product);affected.add(product.id);
      }
    }
    for(const e of entries){
      const product=e.bpId?(g.boxProducts||[]).find(b=>b.id===e.bpId):(g.boxProducts||[]).find(b=>b.contents.includes(e.item));
      if(product&&product.kind!=='single')clearAutoBindOrders(g,product,e.item,e.all?null:e.qty);
      g.orders.push({id:g.nOid++,nick,item:e.item,series:'',qty:e.qty,price:e.price,note:e.note,bpId:e.bpId,all:e.all,lift:isLift,liftCount,liftTargets:isLift?[...liftTargets]:[],memberPriority:e.memberPriority,cancelFixed:e.cancelFixed,ts:Date.now()});
    }
  });
  closeModal();render();
}

function saveOrderEdit(gid,oid){
  const g=getG(gid);const o=g.orders.find(x=>x.id===oid);if(!o)return;
  const newNick=$('#eON').value.trim()||o.nick;
  const newItem=$('#eOI').value.trim()||o.item;
  const newQty=parseInt($('#eOQ').value)||1;
  const newAll=!!$('#eOAll')?.checked;
  const newTs=new Date($('#eOTs').value).getTime();
  const memberPriority=!!getTeam()[newNick]&&!!$('#eOMemberPriority')?.checked&&!usesLegacyClosedRules(g);
  const cancelFixed=orderHasFixedSlot(newNick,newItem)&&!!$('#eOCancelFixed')?.checked;
  if(!Number.isFinite(newTs)){alert('請輸入正確的喊單時間');return;}
  if(newItem!==o.item||newNick!==o.nick){
    if(g.orders.some(x=>x.id!==oid&&x.nick===newNick&&x.item===newItem&&(x.bpId||null)===(o.bpId||null))&&!confirm(`${newNick} 已經喊過「${newItem}」，仍要儲存嗎？`))return;
  }
  const isLift=!!$('#eOLift')?.checked;
  const liftCount=isLift?Math.max(0,parseInt($('#eOLiftCount')?.value)||0):0;
  const liftTargets=isLift?checkedLiftTargetIds('.eLiftTarget'):[];
  const product=o.bpId?(g.boxProducts||[]).find(p=>p.id===o.bpId):(g.boxProducts||[]).find(p=>p.contents.includes(o.item));
  if(isLift&&!usesLegacyClosedRules(g)){
    const candidateIds=new Set(product?getLiftCandidateOrders(g,product,newNick,oid).map(o=>o.id):[]);
    for(const id of(Array.isArray(o.liftTargets)?o.liftTargets:[])){
      const target=g.orders.find(x=>x.id===Number(id));
      if(target&&product&&target.nick===newNick&&!target.bind&&orderMatches(product,target))candidateIds.add(Number(id));
    }
    if(!candidateIds.size){alert(`${newNick} 在「${product?.name||'此商品'}」沒有可提配的喊單，無法提配`);return;}
    if(!liftTargets.some(id=>candidateIds.has(id))){alert('請至少指定一筆目前可提配的喊單');return;}
  }
  upG(gid,g=>{const o=g.orders.find(x=>x.id===oid);if(!o)return;
    const product=o.bpId?(g.boxProducts||[]).find(p=>p.id===o.bpId):(g.boxProducts||[]).find(p=>p.contents.includes(o.item));
    if(product&&product.kind!=='single'){freezeConfirmedBoxes(g,product);clearAutoBindOrders(g,product,newItem,newAll?null:(newItem===o.item?Math.max(0,newQty-o.qty):newQty));}
    o.nick=newNick;o.item=newItem;
    o.qty=newAll?1:newQty;o.all=newAll;o.price=parseFloat($('#eOP').value)||0;o.note=$('#eONote').value.trim();o.ts=newTs;o.cancelFixed=cancelFixed;
    if(!g.manualTableMode)for(const p of(g.boxProducts||[]))for(const row of(p.manualRows||[]))for(let i=0;i<(row||[]).length;i++){
      const cell=row[i];if(!cell||cell.oid!==oid)continue;
      if(p.contents[i]!==newItem)row[i]=null;
      else{cell.nick=newNick;cell.all=newAll;}
    }
    o.lift=isLift;o.liftCount=liftCount;
    if(!usesLegacyClosedRules(g)){o.liftTargets=isLift?[...liftTargets]:[];o.memberPriority=memberPriority;if(isLift)g.orderRulesVersion=2;}
    delete o.bindLift;});
  closeModal();render();
}

let _bpImg=null; // null=未變更, ''=已移除, dataURL=新圖
function imgFileToData(f,cb,max,quality){
  if(!f)return;
  max=max||500;
  quality=quality||0.75;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,max/img.width);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

function setBpImgFile(f){
  if(!f)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=400;const sc=Math.min(1,max/img.width);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      _bpImg=cv.toDataURL('image/jpeg',0.8);
      const prev=$('#bpImgPrev');if(prev){prev.src=_bpImg;prev.style.display='block';}
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}

document.addEventListener('paste',e=>{
  const isBp=!!$('#bpImgPrev'),isCover=!!$('#gCoverPrev');
  if(!isBp&&!isCover)return;
  for(const it of (e.clipboardData?.items||[])){
    if(it.type.startsWith('image/')){
      e.preventDefault();
      if(isBp)setBpImgFile(it.getAsFile());
      else coverFileToData(it.getAsFile(),d=>{
        _gCover=d;
        const prev=$('#gCoverPrev');if(prev){prev.src=d;prev.style.display='block';updateGCoverPos();}
      });
      return;
    }
  }
});

function addBoxProduct(gid){

  const raw=$('#bpC').value.trim();

  const img=_bpImg||'';
  const surcharge=parseFloat($('#bpSur')?.value)||0;
  if(kind==='single'){
    if(!contents.length)contents=[name];
    const unitPrice=parseFloat($('#bpUnit')?.value)||0;
    upG(gid,g=>{if(!g.boxProducts)g.boxProducts=[];if(!g.nBid)g.nBid=Math.max(0,...g.boxProducts.map(p=>Number(p.id)||0))+1;
      g.boxProducts.push({id:g.nBid++,name,kind:'single',contents,unitPrice,maxBoxes:0,pricePerBox:0,priceMode:'average',adjustPrice:false,avgPrice:0,itemPrices:{},img,surcharge});});
    closeModal();render();return;
  }
  if(!contents.length){alert('請輸入至少一個款式');return;}
  if(new Set(contents).size!==contents.length){alert('款式名稱不可重複');return;}
  const blindOpened=kind==='blind'&&!!$('#bpBlindOpened')?.checked;
  const blindCounts=kind==='blind'?collectBlindCounts(contents):{};
  const priceMode=currentBpPriceMode();
  if(priceMode==='adjust'&&Math.abs(priceDiff())>=0.01){alert(`調價合計需為 ±0（目前 ${priceDiff()>0?'+':''}$${Math.round(priceDiff())}）`);return;}
  const avgPrice=priceMode==='fixed'?0:(parseFloat($('#bpAvg')?.value)||0);
  const itemPrices={};
  if(priceMode!=='average'){
    for(const c of contents){
      const el=$('#ip_'+CSS.escape(c)),raw=(el?.value||'').trim();
      if(priceMode==='fixed'&&!raw){alert(`請輸入「${c}」的價格`);return;}
      const n=parseFloat(raw)||0;
      itemPrices[c]=priceMode==='fixed'?n:avgPrice+n;
    }
  }
  const bindItems=collectBindItems(contents);
  const bindOrder=collectBindOrder(contents);
  const sortRule=document.querySelector('input[name=bpSort]:checked')?.value||'fifo';
  upG(gid,g=>{if(!g.boxProducts)g.boxProducts=[];
    g.boxProducts.push({id:g.nBid++,name,kind,contents,maxBoxes:parseInt($('#bpMax').value)||0,pricePerBox:parseFloat($('#bpPrice').value)||0,priceMode,adjustPrice:priceMode==='adjust',avgPrice,itemPrices:priceMode==='average'?{}:itemPrices,bindItems,bindOrder,sortRule,img,surcharge,blindOpened,blindCounts,blindBaseline:[]});});
  closeModal();render();
}

function remapProductSlotKeys(obj,renameMap){
  if(!obj)return obj;
  const out={};
  for(const[key,value]of Object.entries(obj)){
    const sep=key.indexOf('|||');
    if(sep<0){out[key]=value;continue;}
    const item=key.slice(sep+3),next=renameMap[item]||item;
    out[key.slice(0,sep+3)+next]=value;
  }
  return out;
}
function renameProductContents(g,p,oldContents,newContents){
  const renameMap={};
  oldContents.forEach((oldName,i)=>{const next=newContents[i];if(next&&next!==oldName)renameMap[oldName]=next;});
  if(!Object.keys(renameMap).length)return;
  for(const o of(g.orders||[])){
    const belongs=o.bpId?o.bpId===p.id:oldContents.includes(o.item);
    if(belongs&&renameMap[o.item])o.item=renameMap[o.item];
  }
  p.pins=remapProductSlotKeys(p.pins,renameMap);
  p.frozenPins=remapProductSlotKeys(p.frozenPins,renameMap);
  p.layoutPins=remapProductSlotKeys(p.layoutPins,renameMap);
  p.rowPrices=remapProductSlotKeys(p.rowPrices,renameMap);
  for(const field of ['bindItems','bindOrder']){
    if(!p[field])continue;
    const next={};for(const[key,value]of Object.entries(p[field]))next[renameMap[key]||key]=value;p[field]=next;
  }
  if(p.blindCounts){
    const next={};for(const[key,value]of Object.entries(p.blindCounts))next[renameMap[key]||key]=value;p.blindCounts=next;
  }
  if(p.blindAllocPins){
    const next={};for(const[key,value]of Object.entries(p.blindAllocPins))next[renameMap[key]||key]=value;p.blindAllocPins=next;
  }
  if(p.blindBaseline)for(const row of p.blindBaseline)if(renameMap[row.item])row.item=renameMap[row.item];
  if(g.outOfStockItems)g.outOfStockItems=g.outOfStockItems.map(key=>{
    const parts=key.split('|||');
    if(String(parts[0])===String(p.id)&&renameMap[parts[1]])parts[1]=renameMap[parts[1]];
    return parts.join('|||');
  });
  if(g.outOfStockAllocations){
    const moved={};
    for(const[key,value]of Object.entries(g.outOfStockAllocations)){
      const parts=key.split('|||');
      if(String(parts[0])===String(p.id)&&renameMap[parts[1]])parts[1]=renameMap[parts[1]];
      moved[parts.join('|||')]=value;
    }
    g.outOfStockAllocations=moved;
  }
  if(g.ship){
    const moved={};
    for(const[key,value]of Object.entries(g.ship)){
      const parts=key.split('|||');
      if(String(parts[0])===String(p.id)&&renameMap[parts[1]])parts[1]=renameMap[parts[1]];
      moved[parts.join('|||')]=value;
    }
    g.ship=moved;
  }
}
function saveBoxProductEdit(gid,bid){
  const original=(getG(gid)?.boxProducts||[]).find(p=>p.id===bid);
  const oldContents=[...(original?.contents||[])];
  if(document.querySelector('.bpExistingContent'))syncEditBpContents();
  let contents=$('#bpC').value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  const kind=getG(gid)?.type==='basic'?'single':document.querySelector('input[name=bpKind]:checked')?.value||'box';
  const surcharge=parseFloat($('#bpSur')?.value)||0;
  const blindOpened=kind==='blind'&&!!$('#bpBlindOpened')?.checked;
  const blindCounts=kind==='blind'?collectBlindCounts(contents):{};
  if(new Set(contents).size!==contents.length){alert('款式名稱不可重複');return;}
  if(kind==='single'){
    const unitPrice=parseFloat($('#bpUnit')?.value)||0;
    upG(gid,g=>{const p=(g.boxProducts||[]).find(b=>b.id===bid);if(!p)return;
      const nextName=$('#bpN').value.trim()||p.name;
      let nextContents=contents.length?contents:[nextName];
      if(oldContents.length===1&&oldContents[0]===p.name&&nextContents.length===1&&nextContents[0]===oldContents[0])nextContents=[nextName];
      renameProductContents(g,p,oldContents,nextContents);
      p.name=nextName;p.kind='single';
      p.contents=nextContents;p.unitPrice=unitPrice;
      p.maxBoxes=0;p.pricePerBox=0;p.priceMode='average';p.adjustPrice=false;p.avgPrice=0;p.itemPrices={};
      delete p.blindOpened;delete p.blindCounts;delete p.blindBaseline;delete p.blindAllocPins;delete p.rowPrices;delete p.bindItems;delete p.bindOrder;
      p.surcharge=surcharge;
      if(_bpImg!==null)p.img=_bpImg;});
    closeModal();render();return;
  }
  if(!contents.length){alert('至少一個款式');return;}
  const priceMode=currentBpPriceMode();
  if(priceMode==='adjust'&&Math.abs(priceDiff())>=0.01){alert(`調價合計需為 ±0（目前 ${priceDiff()>0?'+':''}$${Math.round(priceDiff())}）`);return;}
  const avgPrice=priceMode==='fixed'?0:(parseFloat($('#bpAvg')?.value)||0);
  const itemPrices={};
  if(priceMode!=='average'){
    for(const c of contents){
      const el=$('#ip_'+CSS.escape(c)),raw=(el?.value||'').trim();
      if(priceMode==='fixed'&&!raw){alert(`請輸入「${c}」的價格`);return;}
      const n=parseFloat(raw)||0;
      itemPrices[c]=priceMode==='fixed'?n:avgPrice+n;
    }
  }
  const bindItems=collectBindItems(contents);
  const bindOrder=collectBindOrder(contents);
  const sortRule=document.querySelector('input[name=bpSort]:checked')?.value||'fifo';
  upG(gid,g=>{const p=(g.boxProducts||[]).find(b=>b.id===bid);if(!p)return;
    const wasBlindOpened=p.kind==='blind'&&p.blindOpened;
    if(kind==='blind'&&blindOpened&&!wasBlindOpened)p.blindBaseline=getRegularProductConfirmedOrders(g,p);
    renameProductContents(g,p,oldContents,contents);
    p.name=$('#bpN').value.trim()||p.name;p.kind=kind;p.contents=contents;p.maxBoxes=parseInt($('#bpMax').value)||0;p.pricePerBox=parseFloat($('#bpPrice').value)||0;
    p.priceMode=priceMode;p.adjustPrice=priceMode==='adjust';p.avgPrice=avgPrice;p.itemPrices=priceMode==='average'?{}:itemPrices;p.bindItems=bindItems;p.bindOrder=bindOrder;p.sortRule=sortRule;p.surcharge=surcharge;
    if(kind==='blind'){
      p.blindOpened=blindOpened;p.blindCounts=blindCounts;
      if(!blindOpened){delete p.blindBaseline;delete p.blindAllocPins;}
    }else{delete p.blindOpened;delete p.blindCounts;delete p.blindBaseline;delete p.blindAllocPins;}
    if(_bpImg!==null)p.img=_bpImg;});
  closeModal();render();
}
function delBoxProduct(gid,bid){
  const g=getG(gid);const p=(g.boxProducts||[]).find(b=>b.id===bid);if(!p)return;
  const related=g.orders.filter(o=>orderMatches(p,o)&&p.contents.includes(o.item)).length;
  if(!confirm(`刪除「${p.name}」？${related?`\n相關的 ${related} 筆喊單也會一併刪除。`:''}`))return;
  upG(gid,g=>{
    const p2=(g.boxProducts||[]).find(b=>b.id===bid);
    if(p2)g.orders=g.orders.filter(o=>!(orderMatches(p2,o)&&p2.contents.includes(o.item)));
    g.boxProducts=(g.boxProducts||[]).filter(b=>b.id!==bid);
  });
  render();
}

let _lastPrioResult=null;
function calcPriority(gid){
  const g=getG(gid);if(!g.orders.length){$('#prioResult').innerHTML='<div class="empty">無喊單</div>';return;}
  const mode=$('#prioMode').value,passRule=$('#passRule').checked;
  const bO={};
  for(const o of g.orders){if(!bO[o.nick])bO[o.nick]=[];bO[o.nick].push({...o});}
  const tots={};
  for(const[nick,ords]of Object.entries(bO)){const q=ords.reduce((s,o)=>s+o.qty,0),a=ords.reduce((s,o)=>s+o.qty*effPrice(g,o),0);tots[nick]={q,a,score:mode==='quantity'?q:a};}
  const sorted=Object.keys(tots).sort((a,b)=>tots[b].score-tots[a].score);
  const stocks={};for(const it of(g.items||[])){if(it.stock>0)stocks[it.name]=it.stock;}
  const rem={...stocks};const hasL=Object.keys(stocks).length>0;
  const alloc={};
  for(const nick of sorted){alloc[nick]=[];for(const o of bO[nick]){const l=rem[o.item]!==undefined;let got=o.qty,lost=0;if(l){got=Math.min(o.qty,rem[o.item]);lost=o.qty-got;rem[o.item]-=got;}alloc[nick].push({item:o.item,want:o.qty,got,lost,limited:l,price:effPrice(g,o)});}}
  _lastPrioResult={gid,alloc,sorted};

  let h=`<div class="card"><h3>排名</h3><p class="muted" style="margin-bottom:8px">依${mode==='quantity'?'總數量':'總金額'}${passRule?' · 缺A pass B':''}</p>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>暱稱</th><th>總數量</th><th>總金額</th><th>分數</th></tr></thead><tbody>`;
  sorted.forEach((nick,i)=>{const t=tots[nick];h+=`<tr><td>${i+1}</td><td>${esc(nick)}</td><td>${t.q}</td><td>$${t.a.toLocaleString()}</td><td><span class="badge b-blue">${t.score}</span></td></tr>`;});
  h+=`</tbody></table></div></div>`;

  if(hasL){
    h+=`<div class="card"><h3>分配明細</h3>
      <div class="btn-row" style="margin-bottom:10px"><button class="bp" onclick="deductPriority()">扣除本次帶多結果</button>
      <button onclick="exportPrioXls()">匯出帶多結果</button>
      <span class="muted">從喊單中移除本次已分配的數量，方便進行下一輪計算</span></div>`;
    for(const nick of sorted){
      const hasLost=alloc[nick].some(a=>a.lost>0);
      h+=`<div style="margin-bottom:12px;padding:10px;background:#fef7fa;border-radius:8px"><div style="margin-bottom:6px"><strong>${esc(nick)}</strong> <span class="badge b-purple">#${sorted.indexOf(nick)+1}</span>`;
      if(passRule&&hasLost)h+=` <span class="badge b-amber">缺A pass B</span>`;
      h+=`</div><table><thead><tr><th>商品</th><th>喊</th><th>得</th><th>缺</th><th>狀態</th></tr></thead><tbody>`;
      for(const a of alloc[nick]){
        let st='';if(!a.limited)st='<span class="badge b-gray">無限制</span>';
        else if(a.lost>0&&a.got>0)st='<span class="badge b-amber">部分</span>';
        else if(a.lost>0)st='<span class="badge b-red">未得</span>';
        else st='<span class="badge b-green">取得</span>';
        if(passRule&&hasLost&&a.got>0&&a.lost===0&&a.limited)st+=' <span class="badge b-amber">必買</span>';
        h+=`<tr><td>${esc(a.item)}</td><td>${a.want}</td><td>${a.got}</td><td>${a.lost}</td><td>${st}</td></tr>`;
      }
      h+=`</tbody></table></div>`;
    }
    h+=`</div>`;
  } else h+=`<div class="card"><p class="muted">到「商品庫存」設定數量後才能計算分配</p></div>`;
  $('#prioResult').innerHTML=h;
}
function deductPriority(){
  if(!_lastPrioResult){alert('請先計算帶多結果');return;}
  const{gid,alloc}=_lastPrioResult;
  if(!confirm('確定要扣除本次帶多結果？\n已分配到的數量會從喊單中扣除（數量減少或移除），庫存也會相應減少。'))return;
  upG(gid,g=>{
    for(const[nick,items]of Object.entries(alloc)){
      for(const a of items){
        if(a.got<=0)continue;
        let toDeduct=a.got;
        for(const o of g.orders){
          if(o.nick===nick&&o.item===a.item&&toDeduct>0){
            const take=Math.min(o.qty,toDeduct);
            o.qty-=take;toDeduct-=take;
          }
        }
        g.orders=g.orders.filter(o=>o.qty>0);
        const it=(g.items||[]).find(i=>i.name===a.item);
        if(it&&it.stock) it.stock=Math.max(0,it.stock-a.got);
      }
    }
  });
  _lastPrioResult=null;
  render();
}

  if(!_lastPrioResult){alert('請先計算帶多結果');return;}
  const{gid,alloc,sorted}=_lastPrioResult;
  const g=getG(gid);if(!g)return;
  const st=S();
  const css=`<style>
    td,th{border:1px solid #999;padding:4px 8px;font-size:11pt;font-family:Arial,sans-serif}
    th{background:#d9e2f3;font-weight:bold;text-align:center}
    .num{text-align:right}
    .ctr{text-align:center}
  </style>`;

  let html=`<table cellspacing="0">
    <tr><td colspan="6" style="font-size:14pt;font-weight:bold;border:none">${esc(g.name)} — 帶多結果</td></tr>
    <tr><th>${esc(st.fieldNick)}</th><th>${esc(st.fieldItem)}</th><th>${esc(st.fieldQty)}</th><th>${esc(st.fieldPrice)}</th><th>獲得</th><th>有無缺</th></tr>`;
  for(const nick of sorted){
    const rows=alloc[nick];

    rows.forEach((a,i)=>{
      html+='<tr>';
      if(i===0)html+=`<td rowspan="${n}" class="ctr" style="vertical-align:middle;font-weight:bold">${esc(nick)}</td>`;
      html+=`<td>${esc(a.item)}</td><td class="ctr">${a.want}</td><td class="num">${a.price?'$'+a.price:'-'}</td>
        <td class="ctr">${a.got}</td>
        <td class="ctr" style="color:${a.lost>0?'#cc0000':'#274e13'};font-weight:bold">${a.lost>0?'缺 '+a.lost:'無缺'}</td>`;
      html+='</tr>';
    });
  }
  html+='</table>';
  downloadXlsxTable(html,g.name+'_帶多結果','帶多結果');
}

function doExport(gid,type){
  const g=getG(gid);const st=S();
  if(type==='csv'){
    let csv=`${st.fieldNick},${st.fieldItem},${st.fieldQty},${st.fieldPrice},小計,${st.fieldNote},總金額\n`;
    const byN={};for(const o of getConfirmedOrders(g)){if(!byN[o.nick])byN[o.nick]=[];byN[o.nick].push(o);}
    const itemLabel=o=>{
      const bp=(g.boxProducts||[]).find(p=>orderMatches(p,o)&&p.contents.includes(o.item));
      return bpItemLabel(bp,o.item);
    };
    for(const[nick,ords]of Object.entries(byN)){
      const total=ords.reduce((s,o)=>s+o.qty*effPrice(g,o),0);
      ords.forEach((o,i)=>{
        const pr=effPrice(g,o);
        csv+=`${i===0?nick:''},${itemLabel(o)},${o.qty},${pr},${o.qty*pr},${o.note||''},${i===0?total:''}\n`;
      });
    }
    const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${g.name}.csv`;a.click();return;
  }
  const byB={};for(const o of getConfirmedOrders(g)){if(!byB[o.nick])byB[o.nick]=[];byB[o.nick].push(o);}
  let text=`=== ${g.name} (${getTypes()[g.type]?.label||''}) ===\n\n`;
  for(const[nick,ords]of Object.entries(byB)){
    text+=`【${nick}】\n`;let total=0;
    for(const o of ords){const pr=effPrice(g,o);const sub=o.qty*pr;text+=`  ${o.item} x${o.qty}`;if(pr)text+=` @$${pr} = $${sub}`;if(o.note)text+=` (${o.note})`;text+='\n';total+=sub;}
    if(total)text+=`  小計：$${total}\n`;text+='\n';
  }
  if(type==='copy'){navigator.clipboard.writeText(text).then(()=>alert('已複製'));return;}
  const box=$('#exportBox');if(box)box.innerHTML=`<div class="export-box">${esc(text)}</div>`;
}

function currentBpPriceMode(){return $('#bpPriceMode')?.value||'average';}
function togglePriceSection(){
  const sec=$('#priceSection');if(!sec)return;
  const mode=currentBpPriceMode();
  const avgGroup=$('#bpAvgGroup');if(avgGroup)avgGroup.style.display=mode==='fixed'?'none':'block';
  sec.style.display=mode==='average'?'none':'block';
  const label=$('#priceInputLabel');
  if(label)label.textContent=mode==='adjust'?'各款差額（合計需為 ±0）':'各款價格';
  const summary=$('#priceSummary');if(summary&&mode!=='adjust')summary.style.display='none';
  if(mode!=='average'){
    const container=$('#priceInputs');if(container)container.innerHTML='';
    refreshPriceInputs();
  }
}
function refreshPriceInputs(existing,sourceMode){
  const ta=$('#bpC');if(!ta)return;
  const contents=ta.value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  const container=$('#priceInputs');if(!container)return;
  if(!contents.length){container.innerHTML='<p class="muted">請先輸入款式</p>';return;}
  const mode=currentBpPriceMode(),avg=parseFloat($('#bpAvg')?.value)||0;
  const current={};
  container.querySelectorAll('input[id^="ip_"]').forEach(el=>{current[el.id.slice(3)]=el.value;});
  let h='<div class="price-grid">';
  for(const c of contents){
    let val='';
    if(current[c]!=null)val=current[c];
    else if(existing&&existing[c]!=null)val=mode==='adjust'?existing[c]-avg:existing[c];
    else if(mode==='adjust')val=0;
    const placeholder=mode==='adjust'?'+5 / -5':'價格';
    h+=`<label>${esc(c)}</label><input id="ip_${esc(c)}" type="number" min="${mode==='fixed'?0:''}" value="${val}" placeholder="${placeholder}" oninput="updatePriceSummary()">`;
  }
  h+='</div>';
  container.innerHTML=h;
  updatePriceSummary();
}
function priceDiff(){
  const ta=$('#bpC');if(!ta)return 0;
  const contents=ta.value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  let total=0;
  for(const c of contents){const el=$('#ip_'+CSS.escape(c));total+=parseFloat(el?.value)||0;}
  return total;
}
function updatePriceSummary(){
  const box=$('#priceSummary');if(!box)return;
  if(currentBpPriceMode()!=='adjust'){box.style.display='none';return;}
  const ta=$('#bpC');if(!ta)return;
  const contents=ta.value.trim().split(/[\n\/,，]/).map(s=>s.trim()).filter(Boolean);
  if(!contents.length){box.style.display='none';return;}
  const diff=priceDiff();
  box.style.display='block';
  box.innerHTML=Math.abs(diff)<0.01?'<span style="color:#3b6d11">合計 ±0</span>':`<span style="color:#a32d2d">合計 ${diff>0?'+':''}$${Math.round(diff)}（需為 ±0 才能儲存）</span>`;
}
function getBoxItemPrice(g,itemName){
  for(const p of (g.boxProducts||[])){
    if(bpHasItemPrices(p)&&p.contents.includes(itemName)&&p.itemPrices[itemName]!=null)return p.itemPrices[itemName];
  }
  return null;
}
function lookupPrice(g,itemName,bpId){
  if(!itemName)return null;
  if(g.type==='carry'){const it=(g.items||[]).find(i=>i.name===itemName);if(it&&it.price)return it.price;}
  if(g.type==='basic'){
    if(bpId){const p=(g.boxProducts||[]).find(b=>b.id===bpId&&b.kind==='single');if(p)return p.unitPrice||null;}
    for(const p of(g.boxProducts||[])){if(p.kind==='single'&&p.contents.includes(itemName)&&p.unitPrice)return p.unitPrice;}
  }
  if(g.type==='box'){
    if(bpId){
      const p=(g.boxProducts||[]).find(b=>b.id===bpId);
      if(p){
        if(p.kind==='single')return p.unitPrice||null;
        return bpFinalItemPrice(p,itemName);
      }
    }
    for(const p of(g.boxProducts||[])){if(p.kind==='single'&&p.contents.includes(itemName)&&p.unitPrice)return p.unitPrice;}
    const ap=getBoxItemPrice(g,itemName);if(ap!=null)return ap;
    for(const p of(g.boxProducts||[])){if(p.kind!=='single'&&p.contents.includes(itemName)&&p.avgPrice)return p.avgPrice;}
  }
  return null;
}
function effPrice(g,o){
  if(g.type==='basic'||o.rowPrice)return o.price||0;
  const p=lookupPrice(g,o.item,o.bpId);
  return p!=null?p:(o.price||0);
}
function fmtTs(ts){
  if(!ts)return '-';
  const d=new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function orderMatches(p,o){
  return o.bpId?o.bpId===p.id:p.contents.includes(o.item);
}
function bpItemLabel(bp,item){
  if(!bp)return item;
  if(bp.contents.length===1&&bp.contents[0]===bp.name)return bp.name;
  return `${bp.name}-${item}`;
}
function productSlotPrice(g,p,slot){
  const key=slot.boxIdx+'|||'+slot.item;
  const custom=Number.isFinite(slot.boxIdx)&&Object.prototype.hasOwnProperty.call(p.rowPrices||{},key);
  const price=custom?Math.max(0,Number(p.rowPrices[key])||0):(lookupPrice(g,slot.item,p.id)||0);
  return {price,custom};
}
function aggregateProductSlots(g,p,slots){
  const agg=new Map();
  for(const s of slots){
    if(!s||!s.buyer)continue;
    const priced=productSlotPrice(g,p,s);
    const key=JSON.stringify([s.buyer.nick,s.item,!!s.buyer.bind,!!s.buyer.liftExtra,priced.price,priced.custom]);
    agg.set(key,(agg.get(key)||0)+1);
  }
  return [...agg.entries()].map(([key,qty])=>{
    const[nick,item,bind,liftExtra,price,rowPrice]=JSON.parse(key);
    return {nick,item,qty,price,note:bind?'綁':liftExtra?'帶餘':'',bpId:p.id,bind,liftExtra,rowPrice};
  });
}
function getRegularProductConfirmedOrders(g,p){
  const info=calcBoxes(g,p),slots=[];
  info.boxes.forEach((box,boxIdx)=>{
    if(box.status==='未成團')return;
    for(const slot of box)if(slot.buyer)slots.push({...slot,boxIdx});

  });
  return aggregateProductSlots(g,p,slots);
}
function resolveBlindProductSlots(g,p){
  const info=calcBoxes(g,{...p,maxBoxes:0}),selected=[];
  for(const item of p.contents){
    const limit=Math.max(0,parseInt((p.blindCounts||{})[item])||0);
    if(!limit)continue;
    const queue=info.boxes.map((box,boxIdx)=>{
      const slot=box.find(s=>s.item===item);
      return slot&&slot.buyer?{...slot,boxIdx}:null;
    }).filter(Boolean);
    const used=new Set(),itemSlots=[];
    for(const pin of((p.blindAllocPins||{})[item]||[])){
      if(itemSlots.length>=limit)break;
      const idx=queue.findIndex((slot,i)=>!used.has(i)&&(pin.oid?slot.buyer.oid===pin.oid&&slot.buyer.bind===!!pin.bind:slot.buyer.nick===pin.nick&&slot.buyer.bind===!!pin.bind));
      if(idx>=0){used.add(idx);itemSlots.push(queue[idx]);}
    }
    for(let i=0;i<queue.length&&itemSlots.length<limit;i++){
      if(!used.has(i)){used.add(i);itemSlots.push(queue[i]);}
    }
    selected.push(...itemSlots);
  }
  return selected;
}
function stabilizeBlindAllocation(g,p){
  if(p.kind!=='blind'||!p.blindOpened)return;
  const pins={};
  for(const slot of resolveBlindProductSlots(g,p)){
    (pins[slot.item]=pins[slot.item]||[]).push({nick:slot.buyer.nick,bind:!!slot.buyer.bind,oid:slot.buyer.oid||0});
  }
  p.blindAllocPins=pins;
}
function getBlindProductConfirmedOrders(g,p){
  if(!p.blindOpened)return getRegularProductConfirmedOrders(g,p);
  return aggregateProductSlots(g,p,resolveBlindProductSlots(g,p));
}
function getBlindAdjustmentMap(g){
  const result={};
  const add=(nick,amount)=>{
    if(!result[nick])result[nick]=0;
    result[nick]+=amount;
  };
  for(const p of(g.boxProducts||[])){
    if(p.kind!=='blind'||!p.blindOpened)continue;
    const baseline=Array.isArray(p.blindBaseline)?p.blindBaseline:getRegularProductConfirmedOrders(g,p);
    const actual=getBlindProductConfirmedOrders(g,p);
    for(const o of applyOutOfStockAdjustments(g,baseline))add(o.nick,-o.qty*effPrice(g,o));
    for(const o of applyOutOfStockAdjustments(g,actual))add(o.nick,o.qty*effPrice(g,o));
  }
  for(const nick of Object.keys(result))result[nick]=Math.round(result[nick]*100)/100;
  return result;
}
function getConfirmedOrdersBeforeShortage(g){
  if(g.type!=='box'||!(g.boxProducts||[]).length)return g.orders||[];
  const res=[];const covered=new Set();
  for(const p of g.boxProducts){
    if(p.kind==='single'){
      for(const o of g.orders){if(p.contents.includes(o.item)&&orderMatches(p,o)){res.push(o);covered.add(o.id);}}
      continue;
    }
    for(const o of g.orders){if(p.contents.includes(o.item)&&orderMatches(p,o))covered.add(o.id);}
    res.push(...(p.kind==='blind'&&p.blindOpened?getBlindProductConfirmedOrders(g,p):getRegularProductConfirmedOrders(g,p)));
  }
  for(const o of g.orders){if(!covered.has(o.id))res.push(o);}
  return res;
}
function getConfirmedOrders(g){
  return applyOutOfStockAdjustments(g,getConfirmedOrdersBeforeShortage(g));
}

function exportXls(gid){
  const g=getG(gid);if(!g)return;

  }

}

function normText(s){
  let i=0;const nums=[];
  const tpl=s.replace(/[\d][\d,.]*/g,m=>{nums.push(m);return `{${++i}}`;});
  return{tpl,nums};
}
function loadTextOv(){
  if(RO)return window.VIEWER_TEXTOV||{};
  return JSON.parse(localStorage.getItem('gp_text_overrides')||'{}');
}
function applyTextOverrides(){
  const map=loadTextOv();
  if(!Object.keys(map).length)return;
  for(const rootId of['app','modalContent']){
    const root=document.getElementById(rootId);if(!root)continue;
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    for(const n of nodes){
      const s=n.nodeValue;if(!s||!s.trim())continue;
      const{tpl,nums}=normText(s);
      const ov=map[tpl];if(!ov||ov===tpl)continue;
      n.nodeValue=ov.replace(/\{(\d+)\}/g,(m,i)=>nums[i-1]!==undefined?nums[i-1]:m);
    }
  }
}
let _editMode=false;
function toggleEditMode(){
  _editMode=!_editMode;
  const btn=document.getElementById('editTextBtn');
  btn.style.background=_editMode?'#a32d2d':'';

  btn.textContent=_editMode?'✏ 編輯中（點文字修改，再按一次結束）':'✏ 修改頁面內容';
}
function editElementText(el){
  const tns=[...el.childNodes].filter(n=>n.nodeType===3&&n.nodeValue.trim());
  if(!tns.length)return;
  const full=tns.map(n=>n.nodeValue).join('');
  const{tpl}=normText(full);
  const map=loadTextOv();
  let key=tpl;
  for(const[k,v]of Object.entries(map)){if(v===tpl){key=k;break;}}
  const cur=map[key]||tpl;
  const input=prompt('修改文字（{1}、{2} 等代表會變動的數字，請保留）：',cur);
  if(input===null)return;
  const val=input.trim();
  if(!val||val===key)delete map[key];
  else map[key]=val;
  localStorage.setItem('gp_text_overrides',JSON.stringify(map));
  render();
}
